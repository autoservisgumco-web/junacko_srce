<!doctype html>
<html lang="sr-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061A35"><title>Кампања — Одговорна Плана</title><link rel="stylesheet" href="style.css">
<style>
.content-page{min-height:75vh;padding:38px 0 70px}.content-page .wrap{width:min(1100px,calc(100% - 32px));margin:auto}.page-kicker{font-size:11px;letter-spacing:2px;font-weight:900;color:#2166F3}.page-title{font-size:clamp(32px,5vw,48px);line-height:1.1;color:#061A35;margin:8px 0 12px}.page-lead{color:#526780;max-width:780px;margin:0 0 28px}.content-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.content-card{overflow:hidden;background:#fff;border:1px solid #dce5f0;border-radius:16px;box-shadow:0 8px 28px #061a350a}.content-card img{width:100%;height:190px;object-fit:cover;display:block;background:#e8eef6}.content-card-body{padding:20px}.content-card h2{font-size:21px;line-height:1.25;margin:0 0 8px;color:#061A35}.content-card p{margin:0 0 14px;color:#526780;white-space:pre-line}.status{display:inline-block;border-radius:30px;padding:5px 10px;background:#e8f1fb;color:#174b91;font-size:12px;font-weight:800;margin-bottom:10px}.page-btn{display:inline-block;text-decoration:none;background:#2166F3;color:#fff;padding:10px 16px;border-radius:9px;font-weight:800}.page-empty{padding:24px;background:#fff;border:1px dashed #b9c9df;border-radius:14px;color:#64748b}.single-hero{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;margin:18px 0 30px}.single-hero img{width:100%;max-height:390px;object-fit:cover;border-radius:16px;background:#e8eef6}.single-copy{min-width:0}.detail-section{background:#fff;border:1px solid #dce5f0;border-radius:15px;padding:22px;margin:16px 0}.detail-section h2{margin:0 0 10px;color:#061A35}.detail-section p{white-space:pre-line;color:#314967}.detail-list{display:grid;gap:10px}.detail-item{padding:14px;border:1px solid #e1eaf2;border-radius:10px;background:#f8fbff}.back-link{display:inline-block;margin-bottom:16px;color:#2166F3;text-decoration:none;font-weight:800}.related-actions{display:grid;gap:12px}.related-actions a{display:block;padding:14px;border:1px solid #dce5f0;border-radius:10px;text-decoration:none;color:#061A35;background:#fff;font-weight:750}
@media(max-width:700px){.single-hero{grid-template-columns:1fr}.single-hero img{max-height:250px}}
</style></head><body>
<header><div class="wrap"><a href="index.html" style="color:#fff;text-decoration:none;font-weight:900;letter-spacing:.4px">ОДГОВОРНА ПЛАНА<small style="display:block;color:#a9c5f5;font-size:10px;letter-spacing:1.5px">МЕСТО ЗА ЗАЈЕДНИЧКО ДЕЛОВАЊЕ</small></a></div></header>
<main class="content-page"><div class="wrap"><a class="back-link" href="kampanje.html">← Све кампање</a><div id="campaignDetail"><div class="page-empty">Учитавање кампање…</div></div></div></main>
<footer><div class="wrap">ОДГОВОРНА ПЛАНА · Место за заједничко деловање · © <span id="year"></span></div></footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>const db=window.supabase.createClient('https://hmfeizkmpmxcnzhwxgbn.supabase.co','sb_publishable_JPtLezaiIeq4MsQ2f3LSlg_nT01Chxe');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const param=new URLSearchParams(location.search).get('slug');</script>
<script>(async()=>{const root=document.getElementById('campaignDetail');if(!param){root.innerHTML='<div class="page-empty">Није изабрана кампања.</div>';return;}try{const {data:c,error}=await db.from('campaigns').select('*').eq('slug',param).eq('is_published',true).maybeSingle();if(error)throw error;if(!c){root.innerHTML='<div class="page-empty">Кампања није пронађена или није објављена.</div>';return;}document.title=c.title+' — Одговорна Плана';let html='<div class="page-kicker">КАМПАЊА</div><section class="single-hero"><div class="single-copy"><span class="status">'+esc(c.status||'Објављена')+'</span><h1 class="page-title">'+esc(c.title)+'</h1><p class="page-lead">'+esc(c.intro_text||c.description||'')+'</p></div>'+(c.hero_image?'<img src="'+esc(c.hero_image)+'" alt="'+esc(c.title)+'">':'')+'</section>';for(const [title,value] of [['О проблему',c.problem_text],['Циљ кампање',c.goal_text||c.goal],['План деловања',c.plan_text],['О кампањи',c.description]])if(value)html+='<section class="detail-section"><h2>'+title+'</h2><p>'+esc(value)+'</p></section>';const [{data:goals,error:ge},{data:sections,error:se},{data:actions,error:ae}]=await Promise.all([db.from('campaign_goals').select('title,description,order_number').eq('campaign_id',c.id).eq('is_active',true).order('order_number'),db.from('campaign_sections').select('title,subtitle,content,order_number').eq('campaign_id',c.id).eq('is_active',true).order('order_number'),db.from('actions').select('title,slug,summary,location,status').eq('campaign_id',c.id).eq('is_published',true).order('created_at',{ascending:false})]);if(ge)throw ge;if(se)throw se;if(ae)throw ae;if(goals?.length)html+='<section class="detail-section"><h2>Циљеви</h2><div class="detail-list">'+goals.map(g=>'<div class="detail-item"><strong>'+esc(g.title)+'</strong>'+(g.description?'<p>'+esc(g.description)+'</p>':'')+'</div>').join('')+'</div></section>';if(sections?.length)html+=sections.map(s=>'<section class="detail-section"><h2>'+esc(s.title||s.subtitle||'Више о кампањи')+'</h2><p>'+esc(s.content||'')+'</p></section>').join('');html+='<section class="detail-section"><h2>Акције у оквиру кампање</h2>'+(actions?.length?'<div class="related-actions">'+actions.map(a=>'<a href="akcija.html?slug='+encodeURIComponent(a.slug||'')+'">'+esc(a.title)+' →'+(a.location?' <small>· '+esc(a.location)+'</small>':'')+'</a>').join('')+'</div>':'<p>Тренутно нема објављених акција у оквиру ове кампање.</p>')+'</section>';root.innerHTML=html;}catch(e){console.error(e);root.innerHTML='<div class="page-empty">Детаљи кампање тренутно нису доступни.</div>';}})();</script></body></html>
