<!doctype html>
<html lang="sr-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061A35"><title>Захтев за информације од јавног значаја — Одговорна Плана</title><link rel="stylesheet" href="style.css">
<style>.io-hero{background:linear-gradient(125deg,#2a6ba3,#17466f);color:#fff;border-radius:0 0 22px 22px;padding:28px 24px;margin:0 0 18px}.io-hero .io-kicker{color:#d8eafa}.io-hero .io-title{color:#fff;margin:9px 0 10px}.io-hero .io-lead{color:#e7f1fa;margin:0;max-width:760px}.io-hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.io-hero-status{display:inline-flex;padding:7px 12px;border-radius:30px;background:#fff;color:#174b79;font-size:12px;font-weight:900}.io-hero-status.waiting{background:#fff0d8;color:#8b570c}.io-hero-status.late{background:#ffe4e4;color:#a52c36}.io-facts-panel{background:#fff;border:1px solid #dce5f0;border-radius:20px;padding:18px;margin:0 0 18px;box-shadow:0 8px 28px #061a3508}.io-institution{background:#edf4fa;border-radius:13px;padding:14px 16px;margin-bottom:12px}.io-institution small,.io-fact small{display:block;color:#718198;font-size:12px;margin-bottom:4px}.io-institution strong{color:#183b5c;font-size:16px;line-height:1.45}.io-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.io-fact{padding:13px;border-radius:13px;background:#edf4fa;min-width:0}.io-fact strong{font-size:15px}.io-fact.deadline{background:#f3f7fb}.io-fact.remaining strong{color:#2a6ba3;font-size:19px}.io-fact.response{background:#eaf6ef}.io-fact.response strong{color:#176b3b}.io-panel{border-radius:18px}.io-question summary{gap:9px}@media(max-width:650px){.content-page{padding:0 0 50px}.content-page .wrap{width:100%}.io-back{margin:16px 16px 12px}.io-hero{border-radius:0 0 20px 20px;padding:25px 20px;margin-bottom:14px}.io-hero .io-title{font-size:29px}.io-facts-panel{margin:0 14px 16px;padding:15px}.io-meta{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.io-institution{grid-column:1/-1}.io-fact{padding:12px}.io-fact strong{font-size:14px}.io-panel{margin:14px;padding:16px}.io-question summary{padding:13px}.io-number{flex-basis:29px;width:29px;height:29px}}</style></head><body>
<header><div class="wrap"><a href="index.html" style="color:#fff;text-decoration:none;font-weight:900;letter-spacing:.4px">ОДГОВОРНА ПЛАНА<small style="display:block;color:#a9c5f5;font-size:10px;letter-spacing:1.5px">МЕСТО ЗА ЗАЈЕДНИЧКО ДЕЛОВАЊЕ</small></a></div></header>
<main class="content-page"><div class="wrap"><a class="io-back" href="akcije.html">← Назад на преглед</a><div id="iojzDetail"><div class="io-empty">Учитавање захтева…</div></div></div></main>
<footer><div class="wrap">ОДГОВОРНА ПЛАНА · Информације од јавног значаја · © <span id="year"></span></div></footer><script>document.getElementById('year').textContent=new Date().getFullYear();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://hmfeizkmpmxcnzhwxgbn.supabase.co','sb_publishable_JPtLezaiIeq4MsQ2f3LSlg_nT01Chxe');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=new URLSearchParams(location.search).get('slug');
const fmt=v=>{if(!v)return '—';const d=new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('sr-RS',{day:'2-digit',month:'long',year:'numeric'});};
const fact=(label,value)=>'<div class="io-fact"><small>'+label+'</small><strong>'+esc(value||'Није евидентирано')+'</strong></div>';
const statusLabel={answered:'Одговорено',partially_answered:'Делимично одговорено',unanswered:'Није одговорено',not_answered:'Није одговорено',not_provided:'Тражени податак није достављен',unclear:'Нејасан одговор',undetermined:'Није могуће утврдити'};
(async()=>{const root=document.getElementById('iojzDetail');if(!slug){root.innerHTML='<div class="io-empty">Није изабран захтев.</div>';return;}
try{
 const {data:a,error:ae}=await db.from('actions').select('id,title,slug,action_type,is_published,summary,intro').eq('slug',slug).eq('is_published',true).maybeSingle();if(ae)throw ae;if(!a){root.innerHTML='<div class="io-empty">Захтев није пронађен или није објављен.</div>';return;}if(a.action_type!=='informacije_od_javnog_znacaja'){root.innerHTML='<div class="io-empty">Ова страница није страница захтева за информације од јавног значаја.</div>';return;}
 const {data:r,error:re}=await db.from('iojz_requests').select('*').eq('action_id',a.id).maybeSingle();if(re)throw re;if(!r){root.innerHTML='<div class="io-empty">Подаци о захтеву нису повезани.</div>';return;}
 const [qs,ds]=await Promise.all([db.from('iojz_questions').select('question_order,title,question_text,answer_text,status').eq('request_id',r.id).order('question_order'),db.from('iojz_documents').select('title,file_name,file_url,document_date').eq('request_id',r.id).eq('is_public',true).order('document_date')]);if(qs.error)throw qs.error;if(ds.error)throw ds.error;
 document.title=(r.subject||a.title)+' — Одговорна Плана';
 const responseDate=r.response_date||r.response_received_at||r.answer_received_at||r.responded_at||null;
 const responseStatus=['answered','responded','completed','response_received'].includes(String(r.status||'').toLowerCase());
 const answered=!!responseDate||responseStatus;
 const baseDate=r.received_at||r.receipt_date||r.sent_at;
 const deadlineDays=Number(r.deadline_days||r.response_deadline_days||(r.extended_deadline_at?40:15));
 const deadlineDate=r.extended_deadline_at||r.deadline_at||r.response_deadline|| (baseDate?(()=>{const d=new Date(baseDate+'T12:00:00');d.setDate(d.getDate()+deadlineDays);return d.toISOString().slice(0,10)})():null);
 const dayDiff=(from,to)=>{if(!from||!to)return null;const a1=new Date(from+'T00:00:00'),b1=new Date(to+'T00:00:00');return Math.round((b1-a1)/86400000)};
 const today=new Date().toISOString().slice(0,10), remaining=deadlineDate?dayDiff(today,deadlineDate):null;
 const statusText=answered?'Одговор је стигао':remaining!==null&&remaining<0?'Рок је истекао':'Чека се одговор';
 const statusClass=answered?'':remaining!==null&&remaining<0?'late':'waiting';
 const remainingText=answered?'Поступак одговора окончан':remaining===null?'Рок није евидентиран':remaining>0?'Још '+remaining+' '+(remaining===1?'дан':'дана'):remaining===0?'Рок истиче данас':'Кашњење: '+Math.abs(remaining)+' '+(Math.abs(remaining)===1?'дан':'дана');
 const fact=(label,value,extra='')=>'<div class="io-fact '+extra+'"><small>'+label+'</small><strong>'+esc(value||'Није евидентирано')+'</strong></div>';
 let html='<section class="io-hero"><div class="io-hero-top"><div class="io-kicker">ИНФОРМАЦИЈЕ ОД ЈАВНОГ ЗНАЧАЈА</div><span class="io-hero-status '+statusClass+'">'+statusText+'</span></div><h1 class="io-title">'+esc(r.subject||a.title)+'</h1><p class="io-lead">'+esc(a.intro||a.summary||'Пратимо шта је затражено од институције, у ком року и шта показују достављени документи.')+'</p></section>';
 html+='<section class="io-facts-panel"><div class="io-institution"><small>Институција</small><strong>'+esc(r.institution_name||'Није евидентирано')+'</strong></div><div class="io-meta">';
 html+=fact('Датум слања',fmt(r.sent_at));
 html+=fact('Рок до',fmt(deadlineDate),'deadline');
 html+=fact('Преостало време',remainingText,'remaining');
 if(answered)html+=fact('Датум одговора',fmt(responseDate||r.updated_at),'response');
 html+='</div></section>';
 html+='<section class="io-panel"><h2>Питања и одговори</h2><p class="io-lead">За свако постављено питање приказан је статус поступања и одговор институције. Интерна анализа није део јавног приказа.</p>';
 html+=(qs.data||[]).map(q=>{const answered=!!(q.answer_text&&q.answer_text.trim());const label=statusLabel[q.status]||(answered?'Одговор је достављен':'Одговор није евидентиран');const cls=q.status==='answered'?'answered':answered?'':'none';return '<details class="io-question"><summary><div class="io-qhead"><div class="io-number">'+esc(q.question_order)+'</div><h3>'+esc(q.title||'Питање '+q.question_order)+'</h3></div><span class="io-status '+cls+'">'+esc(label)+'</span></summary><div class="io-expanded"><div class="io-question-text"><strong>ШТА ЈЕ ПИТАНО</strong><br><br>'+esc(q.question_text||'Текст питања није евидентиран.')+'</div><div class="io-answer"><div class="io-answer-label"><strong>ОДГОВОР ИНСТИТУЦИЈЕ</strong></div><p>'+esc(answered?q.answer_text:'Одговор на ово питање није евидентиран.')+'</p></div></div></details>';}).join('');
 html+='</section><section class="io-panel"><h2>Документи</h2>'+(ds.data&&ds.data.length?'<div class="io-docs">'+ds.data.map(d=>'<div class="io-doc"><div><a href="'+esc(d.file_url)+'" target="_blank" rel="noopener">'+esc(d.title||d.file_name||'Документ')+'</a><small>'+esc(fmt(d.document_date))+'</small></div><span aria-hidden="true">↗</span></div>').join('')+'</div>':'<div class="io-empty">Документи још нису приложени.</div>')+'</section>';
 root.innerHTML=html;
}catch(e){console.error(e);root.innerHTML='<div class="io-empty">Подаци о захтеву тренутно нису доступни.</div>';}})();
</script></body></html>
