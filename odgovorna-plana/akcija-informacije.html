<!doctype html>
<html lang="sr-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061A35"><title>Захтев за информације од јавног значаја — Одговорна Плана</title><link rel="stylesheet" href="style.css">
<style>
.content-page{min-height:75vh;padding:30px 0 70px}.content-page .wrap{width:min(1060px,calc(100% - 32px));margin:auto}.io-back{display:inline-block;margin-bottom:18px;color:#2166F3;text-decoration:none;font-weight:800}.io-kicker{font-size:11px;letter-spacing:2px;font-weight:900;color:#2166F3}.io-title{font-size:clamp(30px,5vw,46px);line-height:1.1;color:#061A35;margin:8px 0 12px}.io-lead{color:#526780;max-width:850px;line-height:1.7;font-size:16px}.io-panel{background:#fff;border:1px solid #dce5f0;border-radius:16px;padding:20px;box-shadow:0 8px 28px #061a3508;margin:18px 0}.io-panel h2{color:#061A35;font-size:20px;margin:0 0 14px}.io-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.io-fact{padding:12px;border-radius:11px;background:#f6f9fd}.io-fact small{display:block;color:#74869a;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}.io-fact strong{display:block;color:#142844;font-size:14px;line-height:1.5;margin-top:4px;overflow-wrap:anywhere}.io-question{padding:18px 0;border-top:1px solid #e8eef5}.io-question:first-child{border-top:0}.io-qhead{display:flex;gap:12px;align-items:flex-start}.io-number{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:#eaf2ff;color:#174b91;display:grid;place-items:center;font-weight:900}.io-question h3{font-size:16px;line-height:1.45;color:#102b4e;margin:3px 0 0}.io-answer{margin:13px 0 0 44px;padding:13px 15px;border-radius:11px;background:#f7f9fc;border:1px solid #e6edf5}.io-answer-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.io-answer-label strong{font-size:11px;letter-spacing:.6px;color:#526780}.io-status{font-size:11px;font-weight:850;padding:5px 9px;border-radius:20px;background:#fff0d8;color:#8b570c}.io-status.answered{background:#e6f5eb;color:#176b3b}.io-status.none{background:#eef1f5;color:#5c6878}.io-answer p{margin:0;color:#344b66;line-height:1.7;font-size:14px;white-space:pre-wrap}.io-docs{display:grid;gap:9px}.io-doc{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px;border:1px solid #e1eaf2;border-radius:11px;background:#f8fbff}.io-doc a{color:#174b91;text-decoration:none;font-weight:800;overflow-wrap:anywhere}.io-doc small{display:block;color:#74869a;font-size:11px;margin-top:3px}.io-empty{padding:18px;border:1px dashed #b9c9df;border-radius:12px;color:#64748b;background:#fff}.io-note{color:#718198;font-size:12px;line-height:1.6}@media(max-width:650px){.content-page{padding:20px 0 50px}.io-panel{padding:16px}.io-meta{grid-template-columns:1fr}.io-title{font-size:30px}.io-answer{margin-left:0}}
</style></head><body>
<header><div class="wrap"><a href="index.html" style="color:#fff;text-decoration:none;font-weight:900;letter-spacing:.4px">ОДГОВОРНА ПЛАНА<small style="display:block;color:#a9c5f5;font-size:10px;letter-spacing:1.5px">МЕСТО ЗА ЗАЈЕДНИЧКО ДЕЛОВАЊЕ</small></a></div></header>
<main class="content-page"><div class="wrap"><a class="io-back" href="akcije.html">← Назад на преглед</a><div id="iojzDetail"><div class="io-empty">Учитавање захтева…</div></div></div></main>
<footer><div class="wrap">ОДГОВОРНА ПЛАНА · Информације од јавног значаја · © <span id="year"></span></div></footer><script>document.getElementById('year').textContent=new Date().getFullYear();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://hmfeizkmpmxcnzhwxgbn.supabase.co','sb_publishable_JPtLezaiIeq4MsQ2f3LSlg_nT01Chxe');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=new URLSearchParams(location.search).get('slug');
const fmt=v=>{if(!v)return '—';const d=new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('sr-RS',{day:'2-digit',month:'long',year:'numeric'});};
const fact=(label,value)=>'<div class="io-fact"><small>'+label+'</small><strong>'+esc(value||'Није евидентирано')+'</strong></div>';
const statusLabel={answered:'Одговорено',partially_answered:'Делимично одговорено',unanswered:'Није одговорено',not_answered:'Није одговорено',not_provided:'Тражени податак није достављен',unclear:'Одговор није јасан'};
(async()=>{const root=document.getElementById('iojzDetail');if(!slug){root.innerHTML='<div class="io-empty">Није изабран захтев.</div>';return;}
try{
 const {data:a,error:ae}=await db.from('actions').select('id,title,slug,action_type,is_published,summary,intro').eq('slug',slug).eq('is_published',true).maybeSingle();if(ae)throw ae;if(!a){root.innerHTML='<div class="io-empty">Захтев није пронађен или није објављен.</div>';return;}if(a.action_type!=='informacije_od_javnog_znacaja'){root.innerHTML='<div class="io-empty">Ова страница није страница захтева за информације од јавног значаја.</div>';return;}
 const {data:r,error:re}=await db.from('iojz_requests').select('id,institution_name,subject,reference_number,request_text,submission_method,sent_at,received_at,status').eq('action_id',a.id).maybeSingle();if(re)throw re;if(!r){root.innerHTML='<div class="io-empty">Подаци о захтеву нису повезани.</div>';return;}
 const [qs,ds]=await Promise.all([db.from('iojz_questions').select('question_order,title,question_text,answer_text,status').eq('request_id',r.id).order('question_order'),db.from('iojz_documents').select('title,file_name,file_url,document_date').eq('request_id',r.id).eq('is_public',true).order('document_date')]);if(qs.error)throw qs.error;if(ds.error)throw ds.error;
 document.title=(r.subject||a.title)+' — Одговорна Плана';
 let html='<div class="io-kicker">ЗАХТЕВ ЗА ПРИСТУП ИНФОРМАЦИЈАМА ОД ЈАВНОГ ЗНАЧАЈА</div><h1 class="io-title">'+esc(r.subject||a.title)+'</h1><p class="io-lead">'+esc(a.intro||a.summary||'Евиденција захтева и одговора надлежне институције.')+'</p>';
 html+='<section class="io-panel"><h2>Подаци о предаји захтева</h2><div class="io-meta">'+fact('Коме је захтев упућен',r.institution_name)+fact('Број предмета',r.reference_number)+fact('Датум предаје',fmt(r.sent_at))+fact('Начин предаје',r.submission_method==='email'?'Електронском поштом':r.submission_method)+fact('Датум пријема / завођења',fmt(r.received_at))+'</div></section>';
 html+='<section class="io-panel"><h2>Питања и одговори</h2><p class="io-lead">За свако постављено питање приказан је статус поступања и одговор институције. Интерна анализа није део јавног приказа.</p>';
 html+=(qs.data||[]).map(q=>{const answered=!!(q.answer_text&&q.answer_text.trim());const label=statusLabel[q.status]||(answered?'Одговор је достављен':'Одговор није евидентиран');const cls=q.status==='answered'?'answered':answered?'':'none';return '<article class="io-question"><div class="io-qhead"><div class="io-number">'+esc(q.question_order)+'</div><h3>'+esc(q.title||'Питање '+q.question_order)+'</h3></div><div class="io-answer"><div class="io-answer-label"><strong>ОДГОВОР ИНСТИТУЦИЈЕ</strong><span class="io-status '+cls+'">'+esc(label)+'</span></div><p>'+esc(answered?q.answer_text:'Одговор на ово питање није евидентиран.')+'</p></div></article>';}).join('');
 html+='</section><section class="io-panel"><h2>Документи</h2>'+(ds.data&&ds.data.length?'<div class="io-docs">'+ds.data.map(d=>'<div class="io-doc"><div><a href="'+esc(d.file_url)+'" target="_blank" rel="noopener">'+esc(d.title||d.file_name||'Документ')+'</a><small>'+esc(fmt(d.document_date))+'</small></div><span aria-hidden="true">↗</span></div>').join('')+'</div>':'<div class="io-empty">Документи још нису приложени.</div>')+'</section>';
 root.innerHTML=html;
}catch(e){console.error(e);root.innerHTML='<div class="io-empty">Подаци о захтеву тренутно нису доступни.</div>';}})();
</script></body></html>
