<!doctype html>
<html lang="sr-Cyrl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061A35">
<title>Захтев за информације од јавног значаја — Одговорна Плана</title>
<link rel="stylesheet" href="style.css">
<style>
.content-page{min-height:75vh;padding:30px 0 70px}.content-page .wrap{width:min(1120px,calc(100% - 32px));margin:auto}
.io-back{display:inline-block;margin-bottom:18px;color:#2166F3;text-decoration:none;font-weight:800}
.io-kicker{font-size:11px;letter-spacing:2px;font-weight:900;color:#2166F3}
.io-title{font-size:clamp(30px,5vw,46px);line-height:1.1;color:#061A35;margin:8px 0 12px;letter-spacing:-1px}
.io-lead{color:#526780;max-width:850px;margin:0 0 22px;line-height:1.7;font-size:16px}
.io-status{display:inline-flex;border-radius:30px;padding:7px 12px;background:#e8f1fb;color:#174b91;font-size:12px;font-weight:850;margin:0 0 12px}
.io-status.partial{background:#fff3df;color:#965b08}.io-status.done{background:#e8f6ed;color:#187344}
.io-layout{display:grid;grid-template-columns:minmax(250px,.72fr) minmax(0,1.55fr);gap:18px;align-items:start}
.io-panel{background:#fff;border:1px solid #dce5f0;border-radius:16px;padding:20px;box-shadow:0 8px 28px #061a3508;margin:0 0 16px;min-width:0}
.io-panel h2{color:#061A35;font-size:20px;margin:0 0 14px}
.io-facts{display:grid;gap:12px}.io-fact{padding-bottom:10px;border-bottom:1px solid #e8eef5}.io-fact:last-child{border-bottom:0;padding-bottom:0}
.io-fact small{display:block;color:#74869a;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.io-fact strong{display:block;color:#142844;font-size:14px;line-height:1.5;margin-top:3px;overflow-wrap:anywhere}
.io-prose{white-space:pre-wrap;line-height:1.75;color:#243d5b;font-size:15px}
.io-question{border:1px solid #e1eaf2;border-radius:13px;padding:16px;margin:12px 0;background:#fbfdff}
.io-question h3{font-size:17px;line-height:1.4;color:#102b4e;margin:0 0 10px}
.io-question-label{font-size:10px;font-weight:900;letter-spacing:1px;color:#2166F3;margin:0 0 7px}
.io-answer{padding-top:12px;margin-top:12px;border-top:1px solid #e8eef5}
.io-answer h4{font-size:13px;color:#173f6d;margin:0 0 7px}
.io-timeline{display:grid;gap:12px}.io-event{border-left:3px solid #2166F3;padding:2px 0 5px 14px}
.io-event time{display:block;color:#2166F3;font-size:11px;font-weight:850;margin-bottom:3px}
.io-event h3{font-size:15px;color:#102b4e;margin:0 0 4px}.io-event p{color:#526780;margin:0;font-size:13px;line-height:1.55;white-space:pre-wrap}
.io-docs{display:grid;gap:9px}.io-doc{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #e1eaf2;border-radius:11px;background:#f8fbff}
.io-doc a{color:#174b91;text-decoration:none;font-weight:800;overflow-wrap:anywhere}.io-doc small{display:block;color:#74869a;font-size:11px;margin-top:3px}
.io-empty{padding:18px;border:1px dashed #b9c9df;border-radius:12px;color:#64748b;background:#fff}
.io-note{background:#f1f6fb;border-left:3px solid #2166F3;padding:13px 15px;border-radius:0 10px 10px 0;color:#405a77;line-height:1.6;margin:14px 0}
@media(max-width:760px){.content-page{padding:20px 0 50px}.io-layout{grid-template-columns:1fr}.io-panel{padding:17px}.io-title{font-size:31px}.io-prose{font-size:14px}}
</style></head>
<body>
<header><div class="wrap"><a href="index.html" style="color:#fff;text-decoration:none;font-weight:900;letter-spacing:.4px">ОДГОВОРНА ПЛАНА<small style="display:block;color:#a9c5f5;font-size:10px;letter-spacing:1.5px">МЕСТО ЗА ЗАЈЕДНИЧКО ДЕЛОВАЊЕ</small></a></div></header>
<main class="content-page"><div class="wrap"><a class="io-back" href="akcije.html">← Назад на преглед</a><div id="iojzDetail"><div class="io-empty">Учитавање захтева…</div></div></div></main>
<footer><div class="wrap">ОДГОВОРНА ПЛАНА · Јавност рада институција · © <span id="year"></span></div></footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://hmfeizkmpmxcnzhwxgbn.supabase.co','sb_publishable_JPtLezaiIeq4MsQ2f3LSlg_nT01Chxe');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=new URLSearchParams(location.search).get('slug');
const fmt=v=>{if(!v)return '—';const d=new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('sr-RS',{day:'2-digit',month:'long',year:'numeric'});};
const fact=(label,value)=>value?'<div class="io-fact"><small>'+label+'</small><strong>'+esc(value)+'</strong></div>':'';
const statusText={draft:'У припреми',sent:'Послат институцији',received:'Пријем потврђен',waiting:'Чека се одговор',extended:'Рок је продужен',answered:'Одговор институције примљен',appealed:'Уложена жалба',closed:'Поступак затворен'};
const questionStatus={unanswered:'Није одговорено',partially_answered:'Делимично одговорено',answered:'Одговорено',not_provided:'Није достављен тражени документ',verification_needed:'Потребна је додатна провера'};
(async()=>{
 const root=document.getElementById('iojzDetail');
 if(!slug){root.innerHTML='<div class="io-empty">Није изабран захтев.</div>';return;}
 try{
  const {data:a,error:aError}=await db.from('actions').select('id,title,slug,summary,intro,description,action_date,campaign_id,action_type,is_published').eq('slug',slug).eq('is_published',true).maybeSingle();
  if(aError)throw aError;
  if(!a){root.innerHTML='<div class="io-empty">Захтев није пронађен или није објављен.</div>';return;}
  if(a.action_type!=='informacije_od_javnog_znacaja'){root.innerHTML='<div class="io-empty">Ова страница је намењена захтевима за информације од јавног значаја.</div>';return;}
  const {data:req,error:reqError}=await db.from('iojz_requests').select('id,institution_name,subject,reference_number,legal_basis,sent_at,received_at,deadline_days,deadline_due_at,status,response_date,response_summary,response_text,action_id').eq('action_id',a.id).maybeSingle();
  if(reqError)throw reqError;
  if(!req){root.innerHTML='<div class="io-empty">Подаци о захтеву још нису повезани са овом страницом.</div>';return;}
  const [qRes,tRes,dRes,iRes,cRes]=await Promise.all([
   db.from('iojz_questions').select('id,question_order,title,question_text,answer_text,analysis_text,missing_information,status').eq('request_id',req.id).order('question_order'),
   db.from('iojz_timeline').select('event_date,title,description,event_type').eq('request_id',req.id).order('event_date'),
   db.from('iojz_documents').select('title,file_name,file_url,document_date,document_type').eq('request_id',req.id).eq('is_public',true).order('document_date'),
   db.from('iojz_request_items').select('item_order,requested_information,response_status,response_note').eq('request_id',req.id).order('item_order'),
   a.campaign_id?db.from('campaigns').select('title,slug').eq('id',a.campaign_id).maybeSingle():Promise.resolve({data:null,error:null})
  ]);
  if(qRes.error)throw qRes.error;if(tRes.error)throw tRes.error;if(dRes.error)throw dRes.error;if(iRes.error)throw iRes.error;
  const questions=qRes.data||[],events=tRes.data||[],docs=dRes.data||[],items=iRes.data||[];
  document.title=(req.subject||a.title)+' — Одговорна Плана';
  const status=statusText[req.status]||'Статус поступка није евидентиран';
  const statusClass=req.status==='answered'||req.status==='closed'?'done':req.status==='waiting'||req.status==='sent'?'':'partial';
  let html='<div class="io-kicker">ЈАВНОСТ РАДА ИНСТИТУЦИЈА</div><span class="io-status '+statusClass+'">'+esc(status)+'</span><h1 class="io-title">'+esc(req.subject||a.title)+'</h1><p class="io-lead">'+esc(a.intro||a.summary||a.description||'Пратимо поступање надлежних институција и објављујемо шта је тражено, шта је достављено и шта се из документације може утврдити.')+'</p>';
  if(cRes.data)html+='<p class="io-note">Кампања: <a href="kampanja.html?slug='+encodeURIComponent(cRes.data.slug||'')+'">'+esc(cRes.data.title)+'</a></p>';
  html+='<div class="io-layout"><aside><section class="io-panel"><h2>Подаци о захтеву</h2><div class="io-facts">'+fact('Институција',req.institution_name)+fact('Број предмета',req.reference_number)+fact('Датум слања',fmt(req.sent_at))+fact('Датум пријема',fmt(req.received_at))+fact('Рок за поступање',req.deadline_days?req.deadline_days+' дана':null)+fact('Рок истиче',fmt(req.deadline_due_at))+fact('Датум одговора',fmt(req.response_date))+fact('Правни основ',req.legal_basis)+'</div></section>';
  if(req.response_summary)html+='<section class="io-panel"><h2>Кратак преглед одговора</h2><div class="io-prose">'+esc(req.response_summary)+'</div></section>';
  html+='</aside><div><section class="io-panel"><h2>Зашто смо тражили информације</h2><div class="io-prose">'+esc(a.reason||a.intro||a.summary||'Циљ је да грађани имају увид у поступање институција и документа која се односе на питања од јавног интереса.')+'</div></section>';
  html+='<section class="io-panel"><h2>Шта смо тражили</h2><div class="io-prose">'+esc(req.request_text||'Оригинални текст захтева није унет у јавни приказ.')+'</div>';
  if(items.length)html+='<ol class="io-prose">'+items.map(x=>'<li>'+esc(x.requested_information)+(x.response_status?'<br><small>'+esc(x.response_status)+'</small>':'')+'</li>').join('')+'</ol>';
  html+='</section>';
  if(questions.length){html+='<section class="io-panel"><h2>Питања и одговори институције</h2><p class="io-lead">Свако питање приказано је засебно, уз одговор и анализу.</p>';
   html+=questions.map(q=>'<article class="io-question"><div class="io-question-label">ПИТАЊЕ '+q.question_order+' · '+esc(questionStatus[q.status]||'СТАТУС НИЈЕ УНЕТ')+'</div><h3>'+esc(q.title||('Питање '+q.question_order))+'</h3><div class="io-prose">'+esc(q.question_text)+'</div><div class="io-answer"><h4>Одговор институције</h4><div class="io-prose">'+esc(q.answer_text||'Одговор није евидентиран.')+'</div></div><div class="io-answer"><h4>Анализа одговора</h4><div class="io-prose">'+esc(q.analysis_text||'Анализа није унета.')+'</div></div>'+(q.missing_information?'<div class="io-answer"><h4>Шта недостаје / шта треба проверити</h4><div class="io-prose">'+esc(q.missing_information)+'</div></div>':'')+'</article>').join('');
   html+='</section>';
  }
  if(req.response_text)html+='<section class="io-panel"><h2>Примљени одговор</h2><div class="io-prose">'+esc(req.response_text)+'</div></section>';
  if(events.length)html+='<section class="io-panel"><h2>Хронологија поступања</h2><div class="io-timeline">'+events.map(ev=>'<article class="io-event"><time>'+fmt(ev.event_date)+'</time><h3>'+esc(ev.title)+'</h3><p>'+esc(ev.description||'')+'</p></article>').join('')+'</div></section>';
  html+='<section class="io-panel"><h2>Документација</h2>'+(docs.length?'<div class="io-docs">'+docs.map(doc=>'<div class="io-doc"><div><a href="'+esc(doc.file_url)+'" target="_blank" rel="noopener">'+esc(doc.title||doc.file_name||'Документ')+'</a><small>'+esc(fmt(doc.document_date))+'</small></div><span aria-hidden="true">↗</span></div>').join('')+'</div>':'<div class="io-empty">Документи још нису приложени за јавни приказ.</div>')+'</section>';
  html+='<p class="io-note">Овај приказ раздваја оригинална питања, наводе институције и анализу достављене документације. Оно што није достављено не значи аутоматски да не постоји.</p></div></div>';
  root.innerHTML=html;
 }catch(e){console.error(e);root.innerHTML='<div class="io-empty">Подаци о захтеву тренутно нису доступни.</div>';}
})();
</script></body></html>
