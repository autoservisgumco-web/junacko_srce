{id:2,title:'Топао дом за свакога',type:'Crowdfunding',summary:'Прикупљамо средства за огрев и основне потребе породица којима је помоћ најпотребнија.',goal:'Прикупити 180.000 динара',status:'Активна',owner:'Јуначко срце',date:'2026-12-20',target:180000,raised:73500,methods:['Донација новца','Донација ствари'],actions:[2]},
{id:3,title:'Врати живот парку',type:'Волонтерска кампања',summary:'Уређујемо запуштену зелену површину и претварамо је у место за све генерације.',goal:'Окупити 25 волонтера',status:'У припреми',owner:'Комшијска иницијатива',date:'2026-11-15',methods:['Волонтирање','Донација ствари','Учешће на догађају'],actions:[3]}],

{id:2,campaignId:2,title:'Прикупљање средстава за огрев',type:'Прикупљање помоћи',summary:'Прикупити средства и евидентирати потребе домаћинстава.',status:'У току',place:'Велика Плана',methods:['Донација новца','Донација ствари'],activities:[3]},
{id:3,campaignId:3,title:'Уређење парка код школе',type:'Теренска акција',summary:'Чишћење, сакупљање алата и припрема зелене површине.',status:'Планирана',place:'Велика Плана',methods:['Волонтирање','Учешће на догађају'],activities:[4,5]}],
activities:[

{id:2,actionId:1,title:'Припрема документације',type:'Онлајн активност',summary:'Сређивање захтева, фотографија и прилога.',date:'2026-11-05',place:'Онлајн',status:'Отворена',methods:['Помоћ у организацији','Стручна помоћ']},

{id:4,actionId:3,title:'Чишћење зелене површине',type:'Догађај на терену',summary:'Чишћење и припрема терена за уређење.',date:'2026-11-14',place:'Парк код школе',status:'Отворена',methods:['Волонтирање','Учешће на догађају']},

let page='home',tab='campaign',edit=null,joinFilter='';
const names={home:'Преглед',campaigns:'Кампање',actions:'Акције',activities:'Активности',join:'Начини учешћа',newcampaign:'Додај кампању',newaction:'Додај акцију',newactivity:'Додај активност',settings:'Прилагоди типове'};
function save(){localStorage.setItem('js_campaign_demo',JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function campName(id){return state.data.campaigns.find(c=>c.id==id)?.title||'Неповезана кампања'}
function actName(id){return state.data.actions.find(a=>a.id==id)?.title||'Неповезана акција'}

function typeOpts(k,val){return opts(state.types[k].map(x=>x[0]),val)}

function tableActivities(list){if(!list.length)return '<div class="panel empty">Нема активности.</div>';return '<div class="panel table-wrap"><table class="table"><thead><tr><th>Активност</th><th>Акција</th><th>Датум и место</th><th>Тип</th><th>Статус</th><th></th></tr></thead><tbody>'+list.map(a=>'<tr><td><b>'+esc(a.title)+'</b><div class="sub">'+esc(a.summary||'')+'</div></td><td>'+esc(actName(a.actionId))+'</td><td>'+esc(a.date||'Није одређен')+'<div class="sub">'+esc(a.place||'')+'</div></td><td>'+esc(a.type)+'</td><td>'+tag(a.status)+'</td><td><button class="btn" data-edit-a="'+a.id+'">Измени</button></td></tr>').join('')+'</tbody></table></div>'}
function home(){let d=state.data;return '<div class="head"><div><div class="eyebrow">Грађани који делују</div><h1>Идеја постаје акција.</h1><p>Покрени кампању, организуј конкретне акције и активности или омогући људима да се укључе на начин који им одговара.</p></div><button class="btn primary" data-go="newcampaign">＋ Покрени кампању</button></div><div class="stats">'+[['Кампање',d.campaigns.length],['Акције',d.actions.length],['Активности',d.activities.length],['Пријаве за учешће',d.joins.length]].map(x=>'<div class="stat"><small>'+x[0]+'</small><div class="num">'+x[1]+'</div></div>').join('')+'</div><div class="section-title"><div><h2>Кампање у фокусу</h2><p>Примери за приказ будућег система.</p></div><button class="btn" data-go="campaigns">Све кампање →</button></div>'+campaignCards(d.campaigns.slice(0,3))+'<div class="section-title"><div><h2>Наредне активности</h2><p>Конкретни начини да се грађани укључе.</p></div><button class="btn" data-go="activities">Све активности →</button></div>'+tableActivities(d.activities.slice(0,4))+'<div class="section-title"><div><h2>Како желиш да помогнеш?</h2><p>Избор начина учешћа филтрира могућности.</p></div></div><div class="panel"><div class="checks">'+state.types.method.slice(0,6).map(m=>'<button class="check" data-method="'+esc(m[0])+'" style="text-align:left"><span>↗</span><span><b>'+esc(m[0])+'</b><small>'+esc(m[1])+'</small></span></button>').join('')+'</div><p><button class="btn soft" data-go="join">Пронађи где могу да помогнем →</button></p></div>'}
function campaigns(){return '<div class="head"><div><div class="eyebrow">Велика слика</div><h1>Кампање</h1><p>Кампања окупља људе око циља. Свака има свој тип, циљ и дозвољене начине укључивања.</p></div><button class="btn primary" data-go="newcampaign">＋ Додај кампању</button></div><div class="toolbar"><input class="search" id="q" placeholder="Претражи кампање…"><select class="filter" id="typeFilter"><option value="">Сви типови</option>'+typeOpts('campaign','')+'</select><select class="filter" id="statusFilter"><option value="">Сви статуси</option>'+opts(['Активна','У припреми','Завршена'],'')+'</select></div><div id="campaignList">'+campaignCards(state.data.campaigns)+'</div>'}
function actions(){return '<div class="head"><div><div class="eyebrow">Конкретни кораци</div><h1>Акције</h1><p>Акција припада кампањи и претвара циљ у конкретан рад. У оквиру ње организују се активности.</p></div><button class="btn primary" data-go="newaction">＋ Додај акцију</button></div><div class="toolbar"><input class="search" id="q" placeholder="Претражи акције…"><select class="filter" id="parentFilter"><option value="">Све кампање</option>'+state.data.campaigns.map(c=>'<option value="'+c.id+'">'+esc(c.title)+'</option>').join('')+'</select></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Акција</th><th>Кампања</th><th>Тип</th><th>Активности</th><th>Статус</th><th></th></tr></thead><tbody>'+state.data.actions.map(a=>'<tr><td><b>'+esc(a.title)+'</b><div class="sub">'+esc(a.place||'')+'</div></td><td>'+esc(campName(a.campaignId))+'</td><td>'+esc(a.type)+'</td><td>'+(a.activities||[]).length+'</td><td>'+tag(a.status)+'</td><td><button class="btn" data-edit-action="'+a.id+'">Измени</button></td></tr>').join('')+'</tbody></table></div>'}
function activities(){return '<div class="head"><div><div class="eyebrow">Конкретно учешће</div><h1>Активности</h1><p>Активност је задатак или догађај у оквиру акције. Има свој тип, датум и начине учешћа.</p></div><button class="btn primary" data-go="newactivity">＋ Додај активност</button></div><div class="toolbar"><input class="search" id="q" placeholder="Претражи активности…"><select class="filter" id="parentFilter"><option value="">Све акције</option>'+state.data.actions.map(a=>'<option value="'+a.id+'">'+esc(a.title)+'</option>').join('')+'</select></div><div id="activityList">'+tableActivities(state.data.activities)+'</div>'}
function joinPage(){let cs=state.data.campaigns.filter(c=>!joinFilter||(c.methods||[]).includes(joinFilter));let as=state.data.activities.filter(a=>!joinFilter||(a.methods||[]).includes(joinFilter));return '<div class="head"><div><div class="eyebrow">Свако може да допринесе</div><h1>Начини учешћа</h1><p>Начин укључивања није исти за све. Дефинише се за сваку кампању, акцију и активност.</p></div></div><div class="panel"><div class="field"><label>Како желиш да се укључиш?</label><select id="methodFilter"><option value="">Прикажи све могућности</option>'+typeOpts('method',joinFilter)+'</select><small class="muted">Избор ће приказати могућности које прихватају тај начин подршке.</small></div></div><div class="section-title"><div><h2>Кампање којима је потребна подршка</h2></div></div>'+campaignCards(cs)+'<div class="section-title"><div><h2>Активности са отвореним учешћем</h2><p>Демо-верзија приказује структуру; пријаве се још не шаљу на сервер.</p></div></div>'+tableActivities(as)}
function campaignForm(){let c=edit?state.data.campaigns.find(x=>x.id===edit):{};return '<div class="head"><div><div class="eyebrow">Креирање</div><h1>'+(edit?'Измени кампању':'Покрени кампању')+'</h1><p>Тип кампање одређује њене могућности; конкретни начини учешћа бирају се за сваку кампању.</p></div></div><form class="panel" id="form"><div class="formgrid"><div class="field"><label>Назив кампање *</label><input name="title" required value="'+esc(c.title||'')+'" placeholder="Нпр. Безбедније улице за све"></div><div class="field"><label>Тип кампање *</label><select name="type" required>'+typeOpts('campaign',c.type||'')+'</select></div><div class="field full"><label>Опис *</label><textarea name="summary" required>'+esc(c.summary||'')+'</textarea></div><div class="field"><label>Циљ</label><input name="goal" value="'+esc(c.goal||'')+'"></div><div class="field"><label>Статус</label><select name="status">'+opts(['У припреми','Активна','Завршена'],c.status||'У припреми')+'</select></div><div class="field"><label>Организатор</label><input name="owner" value="'+esc(c.owner||'')+'"></div><div class="field"><label>Рок</label><input name="date" type="date" value="'+esc(c.date||'')+'"></div><div class="field full"><label>Начини укључивања</label>'+methods(c.methods||[])+'</div><div class="field hidden" id="targetBox"><label>Циљ прикупљања (дин.)</label><input name="target" type="number" min="0" value="'+(c.target||'')+'"></div><div class="field hidden" id="raisedBox"><label>Већ прикупљено (дин.)</label><input name="raised" type="number" min="0" value="'+(c.raised||'')+'"></div></div><div class="actions"><button type="button" class="btn" data-go="campaigns">Откажи</button><button class="btn primary">Сачувај кампању</button></div></form>'}
function actionForm(){let a=edit?state.data.actions.find(x=>x.id===edit):{};return '<div class="head"><div><div class="eyebrow">Креирање</div><h1>'+(edit?'Измени акцију':'Додај акцију')+'</h1><p>Једна кампања може да садржи више акција.</p></div></div><form class="panel" id="form"><div class="formgrid"><div class="field full"><label>Кампања *</label><select name="campaignId" required>'+opts(state.data.campaigns.map(c=>c.id+'|'+c.title),a.campaignId? a.campaignId+'|'+campName(a.campaignId):'')+'</select></div><div class="field"><label>Назив акције *</label><input name="title" required value="'+esc(a.title||'')+'"></div><div class="field"><label>Тип акције *</label><select name="type" required>'+typeOpts('action',a.type||'')+'</select></div><div class="field full"><label>Опис</label><textarea name="summary">'+esc(a.summary||'')+'</textarea></div><div class="field"><label>Место</label><input name="place" value="'+esc(a.place||'')+'"></div><div class="field"><label>Статус</label><select name="status">'+opts(['Планирана','У току','Завршена'],a.status||'Планирана')+'</select></div><div class="field full"><label>Начини укључивања у ову акцију</label>'+methods(a.methods||[])+'</div></div><div class="actions"><button type="button" class="btn" data-go="actions">Откажи</button><button class="btn primary">Сачувај акцију</button></div></form>'}
function activityForm(){let a=edit?state.data.activities.find(x=>x.id===edit):{};return '<div class="head"><div><div class="eyebrow">Креирање</div><h1>'+(edit?'Измени активност':'Додај активност')+'</h1><p>Активност припада једној акцији и може да има посебне услове учешћа.</p></div></div><form class="panel" id="form"><div class="formgrid"><div class="field full"><label>Акција *</label><select name="actionId" required>'+opts(state.data.actions.map(x=>x.id+'|'+x.title),a.actionId?a.actionId+'|'+actName(a.actionId):'')+'</select></div><div class="field"><label>Назив активности *</label><input name="title" required value="'+esc(a.title||'')+'"></div><div class="field"><label>Тип активности *</label><select name="type" required>'+typeOpts('activity',a.type||'')+'</select></div><div class="field full"><label>Опис</label><textarea name="summary">'+esc(a.summary||'')+'</textarea></div><div class="field"><label>Датум</label><input type="date" name="date" value="'+esc(a.date||'')+'"></div><div class="field"><label>Место или линк</label><input name="place" value="'+esc(a.place||'')+'"></div><div class="field"><label>Статус</label><select name="status">'+opts(['Отворена','Попуњена','Завршена'],a.status||'Отворена')+'</select></div><div class="field full"><label>Начини учешћа у овој активности</label>'+methods(a.methods||[])+'</div></div><div class="actions"><button type="button" class="btn" data-go="activities">Откажи</button><button class="btn primary">Сачувај активност</button></div></form>'}
function settings(){let labels={campaign:'Типови кампања',action:'Типови акција',activity:'Типови активности',method:'Начини учешћа'};return '<div class="head"><div><div class="eyebrow">Подешавања система</div><h1>Прилагоди апликацију</h1><p>Каталози су одвојени од кампања, акција и активности. Нове опције додајемо овде.</p></div></div><div class="panel" style="background:#fff7e8;margin-bottom:17px">Ово су демо-подешавања у прегледачу. Касније ће се читати и чувати у бази.</div><div class="panel"><div class="tabs">'+Object.entries(labels).map(([k,v])=>'<button data-tab="'+k+'" class="'+(tab===k?'active':'')+'">'+v+'</button>').join('')+'</div><div class="section-title" style="margin-top:0"><h2>'+labels[tab]+'</h2><button class="btn primary" id="addType">＋ Додај тип</button></div>'+state.types[tab].map((t,i)=>'<div class="typeitem"><div><b>'+esc(t[0])+'</b><div class="sub">'+esc(t[1])+'</div></div><div><button class="btn" data-edit-type="'+i+'">Измени</button> <button class="btn" data-del-type="'+i+'">Уклони</button></div></div>').join('')+'</div>'}
function render(){ $('#crumb').textContent=names[page];$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let html=({home,campaigns,actions,activities,join:joinPage,settings})[page]?.()||'';if(page==='newcampaign')html=campaignForm();if(page==='newaction')html=actionForm();if(page==='newactivity')html=activityForm();$('#view').innerHTML=html;bind()}
function bind(){
$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
$$('[data-edit-c]').forEach(b=>b.onclick=()=>{edit=+b.dataset.editC;page='newcampaign';render()});
$$('[data-edit-action]').forEach(b=>b.onclick=()=>{edit=+b.dataset.editAction;page='newaction';render()});
$$('[data-edit-a]').forEach(b=>b.onclick=()=>{edit=+b.dataset.editA;page='newactivity';render()});
$$('[data-method]').forEach(b=>b.onclick=()=>{joinFilter=b.dataset.method;go('join')});
if($('#q'))$('#q').oninput=filterList;if($('#typeFilter'))$('#typeFilter').onchange=filterList;if($('#statusFilter'))$('#statusFilter').onchange=filterList;if($('#parentFilter'))$('#parentFilter').onchange=filterList;
if($('#methodFilter'))$('#methodFilter').onchange=e=>{joinFilter=e.target.value;render()};
if($('#form')){const f=$('#form');if(page==='newcampaign'){const toggle=()=>{const yes=f.elements.type.value==='Crowdfunding';$('#targetBox').classList.toggle('hidden',!yes);$('#raisedBox').classList.toggle('hidden',!yes)};f.elements.type.onchange=toggle;toggle()}
f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f),ms=fd.getAll('methods');if(page==='newcampaign'){let id=edit||Math.max(0,...state.data.campaigns.map(x=>x.id))+1;let old=state.data.campaigns.find(x=>x.id===id)||{};let c={id,title:fd.get('title').trim(),type:fd.get('type'),summary:fd.get('summary').trim(),goal:fd.get('goal').trim(),status:fd.get('status'),owner:fd.get('owner').trim(),date:fd.get('date'),methods:ms,actions:old.actions||[]};if(c.type==='Crowdfunding'){c.target=+fd.get('target')||0;c.raised=+fd.get('raised')||0}upsert('campaigns',c);go('campaigns');toast('Кампања сачувана у демо-прототипу.')}
else if(page==='newaction'){let id=edit||Math.max(0,...state.data.actions.map(x=>x.id))+1,old=state.data.actions.find(x=>x.id===id)||{},cid=+(String(fd.get('campaignId')).split('|')[0]);let a={id,campaignId:cid,title:fd.get('title').trim(),type:fd.get('type'),summary:fd.get('summary').trim(),place:fd.get('place').trim(),status:fd.get('status'),methods:ms,activities:old.activities||[]};upsert('actions',a);state.data.campaigns.forEach(c=>{c.actions=(c.actions||[]).filter(x=>!state.data.actions.some(a=>a.id===x&&a.campaignId!==c.id));if(c.id===cid&&!c.actions.includes(id))c.actions.push(id)});save();go('actions');toast('Акција сачувана у демо-прототипу.')}
else{let id=edit||Math.max(0,...state.data.activities.map(x=>x.id))+1,aid=+(String(fd.get('actionId')).split('|')[0]);let a={id,actionId:aid,title:fd.get('title').trim(),type:fd.get('type'),summary:fd.get('summary').trim(),date:fd.get('date'),place:fd.get('place').trim(),status:fd.get('status'),methods:ms};upsert('activities',a);state.data.actions.forEach(x=>{x.activities=(x.activities||[]).filter(n=>!state.data.activities.some(a=>a.id===n&&a.actionId!==x.id));if(x.id===aid&&!x.activities.includes(id))x.activities.push(id)});save();go('activities');toast('Активност сачувана у демо-прототипу.')}}}
$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if($('#addType'))$('#addType').onclick=()=>editType();
$$('[data-edit-type]').forEach(b=>b.onclick=()=>editType(+b.dataset.editType));
$$('[data-del-type]').forEach(b=>b.onclick=()=>{let i=+b.dataset.delType;if(confirm('Уклонити ову опцију из каталога?')){state.types[tab].splice(i,1);save();render()}});
}
function upsert(key,item){let i=state.data[key].findIndex(x=>x.id===item.id);if(i<0)state.data[key].unshift(item);else state.data[key][i]=item;save()}
function filterList(){let q=($('#q')?.value||'').toLowerCase(),parent=$('#parentFilter')?.value||'',type=$('#typeFilter')?.value||'',status=$('#statusFilter')?.value||'';if(page==='campaigns'){let list=state.data.campaigns.filter(c=>(c.title+' '+c.summary).toLowerCase().includes(q)&&(!type||c.type===type)&&(!status||c.status===status));$('#campaignList').innerHTML=campaignCards(list);bind()}else if(page==='actions'){$$('#view tbody tr').forEach(r=>r.classList.toggle('hidden',!r.textContent.toLowerCase().includes(q)||(parent&&!r.textContent.includes(campName(parent)))))}else if(page==='activities'){let list=state.data.activities.filter(a=>(a.title+' '+a.summary).toLowerCase().includes(q)&&(!parent||String(a.actionId)===parent));$('#activityList').innerHTML=tableActivities(list);bind()}}
function editType(i){let old=i===undefined?['','']:state.types[tab][i],n=prompt('Назив:',old[0]);if(n===null||!n.trim())return;let d=prompt('Кратак опис:',old[1]||'');if(d===null)return;if(state.types[tab].some((x,j)=>j!==i&&x[0].toLowerCase()===n.trim().toLowerCase()))return alert('Тај назив већ постоји.');let x=[n.trim(),d.trim()];if(i===undefined)state.types[tab].push(x);else state.types[tab][i]=x;save();render();toast('Каталог је ажуриран.')}
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)};$('#menu').onclick=()=>$('#side').classList.toggle('open');render();
</script><style>.link{border:0;background:none;color:var(--g);font-weight:800}</style></body></html>
