<!doctype html>
<html lang="sr-Cyrl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061A35"><title>Кампања — Одговорна Плана</title><meta name="description" content="Детаљи кампање — Одговорна Плана."><link rel="stylesheet" href="/stranice.css">  <link rel="stylesheet" href="/bottom-nav.css"><link rel="stylesheet" href="/donation-types.css">
<style>
/* Детаљ кампање — визуелни шаблон усклађен са детаљем акције */
body.campaign-page{background:#f7f8fa;overflow-x:hidden}
body.campaign-page .site-header{position:relative;width:100%;max-width:none;margin:0;left:0;right:0;border-radius:0;background:#061A35;height:84px;padding:10px max(3vw,22px);box-shadow:0 2px 16px #102b4e20}
body.campaign-page .content-main{padding:0 0 100px}
body.campaign-page .content-wrap{max-width:1440px;margin:0 auto;padding:0 20px}
body.campaign-page .content-back{display:none}
.campaign-cover{height:clamp(210px,30vw,390px);position:relative;background:#0b2c53 center/cover no-repeat;border-radius:18px 18px 0 0;overflow:hidden}
.campaign-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,19,39,.42),transparent 75%)}
.campaign-status{position:absolute;z-index:1;top:22px;left:22px;border-radius:24px;padding:9px 16px;background:#16834b;color:#fff;font-size:13px;font-weight:850}
.campaign-status.draft{background:#64748b}.campaign-status.completed{background:#475569}
.campaign-overview{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:25px;background:#fff;border:1px solid #e1e5eb;border-radius:0 0 18px 18px;padding:28px 30px;box-shadow:0 5px 20px #0f172a08}
.campaign-kind{display:inline-flex;background:#eef2f6;color:#273244;border-radius:22px;padding:6px 13px;font-size:13px;font-weight:850}
.campaign-main h1{font-size:clamp(30px,3.5vw,48px);line-height:1.1;letter-spacing:-1.2px;margin:13px 0;color:#111827}
.campaign-summary{font-size:clamp(16px,1.6vw,21px);line-height:1.5;color:#374151;margin:0}
.campaign-meta{display:flex;flex-wrap:wrap;gap:12px 22px;border-top:1px solid #e5e7eb;margin-top:20px;padding-top:16px;color:#374151}
.campaign-meta span{font-size:14px}
.campaign-progress{border-left:1px solid #e5e7eb;padding:8px 0 8px 25px;display:flex;flex-direction:column;justify-content:center}
.campaign-progress strong{font-size:40px;color:#111827;line-height:1}
.campaign-progress small{color:#64748b;margin:7px 0 15px}
.campaign-progress-track{height:9px;border-radius:20px;background:#e8edf3;overflow:hidden}
.campaign-progress-track span{display:block;height:100%;background:#2166f3;border-radius:20px}
.campaign-cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.campaign-cta{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#d71920;color:#fff;border-radius:11px;padding:12px 18px;font-weight:800}
.campaign-cta.secondary{background:#eef2f7;color:#1f2937}
.campaign-section{background:#fff;border:1px solid #e1e5eb;border-radius:16px;padding:22px 26px;margin-top:16px}
.campaign-section h2{font-size:22px;color:#111827;margin:0 0 12px}
.campaign-section p{white-space:pre-line;color:#374151;font-size:16px;line-height:1.7;margin:0}
.campaign-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.campaign-item{border:1px solid #e5eaf0;border-radius:13px;padding:17px;background:#fff}
.campaign-item strong{display:block;color:#172033;font-size:16px;margin-bottom:6px}
.campaign-item p{font-size:14px;line-height:1.55;color:#64748b}
.campaign-item .item-meta{font-size:12px;color:#64748b;margin-top:8px}
.campaign-progress-note{font-size:13px;color:#64748b;margin-top:7px}
.campaign-joinbar{position:fixed;z-index:120;left:0;right:0;bottom:70px;display:flex;align-items:center;justify-content:center;padding:10px  max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:transparent;pointer-events:none}.campaign-joinbar .campaign-cta{width:min(650px,100%);min-height:50px;box-shadow:0 8px 25px #061a3540;pointer-events:auto;font-size:16px}
.campaign-joinbar .campaign-cta{white-space:nowrap}
.campaign-empty{background:#fff;border:1px solid #e1e5eb;border-radius:14px;padding:18px;color:#64748b}
@media(max-width:760px){body.campaign-page .site-header{width:100%;height:78px;margin:0;padding:10px 14px}body.campaign-page .content-wrap{padding:0 12px}.campaign-cover{height:215px;border-radius:12px 12px 0 0}.campaign-status{top:14px;left:14px}.campaign-overview{grid-template-columns:1fr;padding:19px 17px;gap:15px}.campaign-progress{border-left:0;border-top:1px solid #e5e7eb;padding:15px 0 0}.campaign-grid{grid-template-columns:1fr}.campaign-section{padding:18px 16px;margin-top:12px}.campaign-section h2{font-size:20px}.campaign-section p{font-size:15px}.campaign-joinbar{bottom:68px;padding-left:13px;padding-right:13px}}
/* Interaktivne prijave kampanje */.support-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.support-launch{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:15px;border:1px solid #dce4ee;border-radius:13px;background:#f8fbff;color:#172033;cursor:pointer}.support-launch:hover{border-color:#2166f3;background:#f1f6ff}.support-icon{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:11px;background:#e6efff;color:#174ea6;font-size:20px}.support-launch strong,.support-launch small{display:block}.support-launch small{color:#64748b;margin-top:4px;line-height:1.4}.campaign-overlay{display:none;position:fixed;inset:0;z-index:200;background:#061a35a8;align-items:flex-end;justify-content:center}.campaign-overlay.open{display:flex}.campaign-sheet{width:min(100%,650px);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 45px #061a3530}.sheet-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.sheet-head h2{margin:0;font-size:23px}.sheet-head p{margin:6px 0 0;color:#64748b;font-size:14px}.sheet-close{border:0;border-radius:50%;width:38px;height:38px;font-size:23px;background:#eef2f7;cursor:pointer}.support-form{display:grid;gap:12px}.support-form label{display:grid;gap:6px;font-size:13px;font-weight:750;color:#344054}.support-form input,.support-form select,.support-form textarea{box-sizing:border-box;width:100%;border:1px solid #d7dee8;border-radius:10px;padding:12px;font:inherit;font-size:15px;background:#fff}.support-form textarea{min-height:85px}.support-form button{border:0;border-radius:11px;padding:13px;background:#d71920;color:white;font-weight:800;cursor:pointer}.prototype-note{padding:10px 12px;background:#fff7e8;color:#81540b;border:1px solid #f5dfb5;border-radius:10px;font-size:12px;line-height:1.5}@media(max-width:560px){.support-options{grid-template-columns:1fr}.campaign-sheet{padding:19px 16px calc(20px + env(safe-area-inset-bottom))}}
/* Sheet is lifted above the mobile navigation; its content scrolls independently. */
.campaign-overlay{align-items:flex-end;padding:12px 12px 76px;box-sizing:border-box;overflow:hidden}
.campaign-sheet{display:flex;flex-direction:column;width:min(100%,650px);max-height:min(82dvh,760px);overflow:hidden;margin:0 auto;border-radius:22px;padding:18px 20px 12px}
.campaign-sheet .sheet-head{flex:none;position:sticky;top:0;background:#fff;z-index:2;padding-bottom:10px}
#sheetBody{min-height:0;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 2px 20px}
@media(max-width:560px){.campaign-overlay{padding:8px 0 calc(74px + env(safe-area-inset-bottom))}.campaign-sheet{width:100%;max-height:84dvh;border-radius:20px 20px 0 0;padding:16px 15px 10px}.campaign-sheet .sheet-head{margin-bottom:10px}}
</style>
</head><body class="content-page-body campaign-page">
<header class="site-header"><a class="site-brand" href="/index.html" aria-label="Одговорна Плана — почетна"><span class="brand-heart">♡</span><span>Одговорна<br>Плана</span></a><nav class="site-nav" aria-label="Главна навигација"><a href="/index.html">Почетна</a><a href="/kampanje.html">Кампање</a><a href="/akcije.html">Акције</a><a href="/podrska.html">Подршка</a></nav><button class="menu-trigger" id="openMenu" type="button" aria-label="Отвори мени">☰</button></header><div class="menu-backdrop" id="menuBackdrop" hidden></div><aside class="side-menu" id="sideMenu" aria-hidden="true"><div class="side-menu-head"><span>♡ Одговорна Плана</span><button class="side-menu-close" id="closeMenu" type="button" aria-label="Затвори мени">×</button></div><nav aria-label="Мени"><a href="/index.html">Почетна</a><a href="/kampanje.html">Кампање</a><a href="/akcije.html">Акције</a><a href="/o-projektu.html">О пројекту</a><a href="/podrska.html">Подршка</a></nav></aside><main class="content-main"><div class="content-wrap"><div id="campaignDetail"><div class="content-empty">Учитавање кампање…</div></div></div></main>
<footer class="content-footer"><div class="content-footer-inner">ОДГОВОРНА ПЛАНА · Место за заједничко деловање · © <span id="year"></span></div></footer>
<script>document.getElementById('year').textContent=new Date().getFullYear();const menu=document.getElementById('sideMenu'),back=document.getElementById('menuBackdrop');function closeSideMenu(){menu.classList.remove('open');back.classList.remove('open');menu.setAttribute('aria-hidden','true');setTimeout(()=>back.hidden=true,260)}document.getElementById('openMenu').addEventListener('click',()=>{back.hidden=false;menu.setAttribute('aria-hidden','false');requestAnimationFrame(()=>{back.classList.add('open');menu.classList.add('open')})});document.getElementById('closeMenu').addEventListener('click',closeSideMenu);back.addEventListener('click',closeSideMenu);</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/database.js"></script><script src="/donation-types.js"></script><script>const db=window.db;const param=new URLSearchParams(location.search).get("slug");</script>
<script>
(async()=>{
 const root=document.getElementById('campaignDetail');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const dateFmt=v=>{if(!v)return '';const d=new Date(v+'T00:00:00');return isNaN(d)?String(v):d.toLocaleDateString('sr-RS')};
 const statusLabel=v=>({active:'Активна',draft:'У припреми',completed:'Завршена',paused:'Паузирана',planned:'Планирана',in_progress:'У току',completed_activity:'Завршено'}[v]||v||'Објављена');
 const itemCard=(title,description,meta='')=>'<article class="campaign-item"><strong>'+esc(title)+'</strong>'+(description?'<p>'+esc(description)+'</p>':'')+(meta?'<div class="item-meta">'+esc(meta)+'</div>':'')+'</article>';
 if(!param){root.innerHTML='<div class="campaign-empty">Није изабрана кампања.</div>';return;}
 try{
  let q=db.from('campaigns').select('*').eq('is_published',true);
  q=param.match(/^[0-9a-f-]{36}$/i)?q.eq('id',param):q.eq('slug',param);
  const {data:c,error}=await q.maybeSingle();if(error)throw error;
  if(!c){root.innerHTML='<div class="campaign-empty">Кампања није пронађена или није објављена.</div>';return;}
  document.title=c.title+' — Одговорна Плана';
  const [goalsRes,sectionsRes,activitiesRes,rolesRes,optionsRes,actionsRes,donationSettingsRes,donationItemsRes]=await Promise.all([
   db.from('campaign_goals').select('title,description,goal_type,target_value,current_value,order_number').eq('campaign_id',c.id).eq('is_active',true).order('order_number'),
   db.from('campaign_sections').select('section_type,title,subtitle,content,order_number').eq('campaign_id',c.id).eq('is_active',true).order('order_number'),
   db.from('campaign_activities').select('title,description,activity_type,status,activity_date,order_number').eq('campaign_id',c.id).eq('is_published',true).order('order_number'),
   db.from('campaign_support_roles').select('id,label,role_type,description,icon,route,order_number').eq('campaign_id',c.id).eq('is_active',true).eq('is_published',true).order('order_number'),
   db.from('campaign_volunteer_options').select('label').eq('campaign_id',c.id),
   db.from('actions').select('id,title,slug,summary,location,status,action_date,image_url').eq('campaign_id',c.id).eq('is_published',true).order('created_at',{ascending:false}),
   db.from('campaign_donations').select('*').eq('campaign_id',c.id).eq('is_active',true).maybeSingle(),
   db.from('campaign_donation_items').select('*').eq('campaign_id',c.id).eq('is_active',true).order('order_number')
  ]);
  const optional=(name,r)=>{if(r.error){console.warn('Не могу да учитам '+name+':',r.error);return [];}return r.data||[];};
  const goals=optional('циљеве',goalsRes),sections=optional('секције',sectionsRes),activities=optional('активности',activitiesRes),roles=optional('начине подршке',rolesRes),options=optional('опције волонтера',optionsRes),actions=optional('акције',actionsRes),donationSettings=donationSettingsRes.data||null,donationItems=optional('ставке донација',donationItemsRes);
  const progress=Math.max(0,Math.min(100,Number(c.progress_percent)||0));
  const cover=c.hero_image?(String(c.hero_image).startsWith('http')?c.hero_image:'/'+String(c.hero_image).replace(/^\//,'')):'';
  let html='<div class="campaign-cover"'+(cover?' style="background-image:url(&quot;'+esc(cover)+'&quot;)"':'')+'><span class="campaign-status '+(c.status==='completed'?'completed':c.status==='draft'?'draft':'')+'">'+esc(statusLabel(c.status))+'</span></div>';
  html+='<section class="campaign-overview"><div class="campaign-main"><span class="campaign-kind">КАМПАЊА</span><h1>'+esc(c.title)+'</h1><p class="campaign-summary">'+esc(c.intro_text||c.description||'')+'</p><div class="campaign-meta">'+(c.start_date?'<span>📅 Почетак: '+esc(dateFmt(c.start_date))+'</span>':'')+(c.end_date?'<span>🏁 Завршетак: '+esc(dateFmt(c.end_date))+'</span>':'')+'</div></div><aside class="campaign-progress"><strong>'+progress+'%</strong><small>Напредак кампање</small><div class="campaign-progress-track"><span style="width:'+progress+'%"></span></div><div class="campaign-progress-note">Приказ напретка према податку у кампањи</div></aside></section>';
  const addText=(title,value)=>{if(value)html+='<section class="campaign-section"><h2>'+title+'</h2><p>'+esc(value)+'</p></section>';};
  addText('Проблем који решавамо',c.problem_text);
  addText('Циљ кампање',c.goal_text||c.goal);
  addText('Како ћемо деловати',c.plan_text);
  if(sections.length)html+='<section class="campaign-section"><h2>Тема и прича кампање</h2><div class="campaign-grid">'+sections.map(x=>itemCard(x.title||x.subtitle||'Више о кампањи',x.content,x.subtitle||'')).join('')+'</div></section>';
  if(goals.length)html+='<section class="campaign-section"><h2>Циљеви и кораци</h2><div class="campaign-grid">'+goals.map(x=>itemCard(x.title,x.description,(x.goal_type?x.goal_type.replace(/_/g,' '):'')+(x.target_value!==null&&x.target_value!==''?' · Циљ: '+x.target_value:'')+(x.current_value!==null&&x.current_value!==''?' · Остварено: '+x.current_value:''))).join('')+'</div></section>';
  if(activities.length)html+='<section class="campaign-section"><h2>Активности кампање</h2><div class="campaign-grid">'+activities.map(x=>itemCard(x.title,x.description,[statusLabel(x.status),dateFmt(x.activity_date)].filter(Boolean).join(' · '))).join('')+'</div></section>';
  if(actions.length)html+='<section class="campaign-section"><h2>Акције у оквиру кампање</h2><div class="campaign-grid">'+actions.map(x=>'<article class="campaign-item">'+(x.image_url?'<img src="'+esc(x.image_url)+'" alt="" style="width:100%;height:150px;object-fit:cover;border-radius:9px;margin-bottom:12px">':'')+'<strong>'+esc(x.title)+'</strong>'+(x.summary?'<p>'+esc(x.summary)+'</p>':'')+'<div class="item-meta">'+[statusLabel(x.status),x.location,dateFmt(x.action_date)].filter(Boolean).map(esc).join(' · ')+'</div><p style="margin-top:13px"><a class="campaign-cta" href="/akcija.html?slug='+encodeURIComponent(x.slug||x.id)+'">Погледај акцију →</a></p></article>').join('')+'</div></section>';

  if(!sections.length&&!goals.length&&!activities.length&&!actions.length&&!roles.length&&!options.length)addText('О кампањи',c.description);
  html+='<section class="campaign-section"><h2>Кампања се гради заједно</h2><p>Имаш предлог, знање или време? Постани део заједничког рада.</p><p style="margin-top:12px"><a href="/kampanje.html">Погледај све кампање →</a></p></section>';

  window.__campaignRoles=roles;window.__campaignVolunteerOptions=options;
  window.openSupportChooser=()=>{
    if(!roles.length){
      showSheet('Како можеш да помогнеш','Начини укључивања за ову кампању још нису објављени.','<div class="donation-empty">Администратор још није објавио начине укључивања за ову кампању.</div>');
      return;
    }
    const cards=roles.map((r,i)=>'<button class="support-launch" type="button" onclick="openSupportForm('+i+')"><span class="support-icon"><i class="fas '+esc(r.icon||'fa-heart')+'"></i></span><span><strong>'+esc(r.label)+'</strong><small>'+esc(r.description||'Погледај детаље и начин укључивања.')+'</small></span></button>').join('');
    showSheet('Како желиш да помогнеш?','Изабери начин на који можеш да допринесеш овој кампањи.','<div class="support-options">'+cards+'</div>');
  };
  window.openSupportForm=(idx)=>{
    const r=roles[idx];
    const type=String(r?.role_type||r?.route||'other').toLowerCase();
    const label=r?.label||'Подршка кампањи';
    if(/money|financial|donat|goods|material|донац|хран|опрем/i.test(type+' '+label)){
      const title=/goods|material|хран|опрем/i.test(type+' '+label)?'Донација ствари и материјала':'Новчане донације';
      showSheet(title,'Изабери шта можеш да донираш и контактирај особу задужену за кампању.',window.DonationTypes.renderPanel(donationSettings,donationItems));
      return;
    }
    let fields='<label>Име и презиме<input name="name" required autocomplete="name"></label><label>Телефон<input name="phone" required autocomplete="tel"></label><label>Место<input name="place"></label>';
    if(/volunteer|volon/i.test(type+' '+label))fields+='<label>Изабери област у којој желиш да помогнеш<select name="volunteer_option"><option value="">Изабери област</option>'+options.map(o=>'<option>'+esc(o.label)+'</option>').join('')+'</select></label><label>У чему још можеш да помогнеш?<textarea name="skills" required></textarea></label><label>Када си доступан/доступна?<input name="availability"></label>';
    else if(/service|услуг|струч/i.test(type+' '+label))fields+='<label>Коју услугу или знање нудиш?<textarea name="service" required></textarea></label><label>Област рада / искуство<input name="experience"></label>';
    else if(/share|подел/i.test(type+' '+label))fields+='<label>Где ћеш поделити кампању?<select name="channel"><option>Facebook</option><option>Instagram</option><option>Viber</option><option>Друго</option></select></label>';
    else fields+='<label>Како желиш да помогнеш?<textarea name="details" required></textarea></label>';
    showSheet(label,'Пријава за кампању „'+esc(c.title)+'“','<form class="support-form" onsubmit="submitPrototype(event)">'+fields+'<div class="prototype-note">Пријава за овај начин помоћи још није повезана са слањем података.</div><button type="submit">Пошаљи пријаву</button></form>');
  };
  window.openActionJoin=(id,title)=>showSheet('Придружи се акцији',title,'<form class="support-form" onsubmit="submitPrototype(event)"><label>Име и презиме<input required name="name"></label><label>Телефон<input required name="phone"></label><label>Место<input name="place"></label><label>Како желиш да учествујеш?<textarea required name="details"></textarea></label><div class="prototype-note">Интерактивни прототип — пријава се још не уписује у базу.</div><button type="submit">Пријави се за акцију</button></form>');
  function showSheet(title,subtitle,body){let o=document.getElementById('campaignOverlay');if(!o){o=document.createElement('div');o.id='campaignOverlay';o.className='campaign-overlay';o.innerHTML='<section class="campaign-sheet" role="dialog" aria-modal="true"><div class="sheet-head"><div><h2 id="sheetTitle"></h2><p id="sheetSubtitle"></p></div><button class="sheet-close" type="button" onclick="closeCampaignSheet()">×</button></div><div id="sheetBody"></div></section>';o.onclick=e=>{if(e.target===o)closeCampaignSheet()};document.body.appendChild(o)}o.querySelector('#sheetTitle').textContent=title;o.querySelector('#sheetSubtitle').textContent=subtitle;o.querySelector('#sheetBody').innerHTML=body;o.classList.add('open');document.body.style.overflow='hidden'}
  window.closeCampaignSheet=()=>{document.getElementById('campaignOverlay')?.classList.remove('open');document.body.style.overflow=''};
  window.submitPrototype=e=>{e.preventDefault();if(!e.target.reportValidity())return;e.target.innerHTML='<h3 style="color:#16834b">Пријава је попуњена.</h3><p>Ово је прототип; повезивање са базом података следи.</p><button type="button" onclick="closeCampaignSheet()">Затвори</button>'};

  root.innerHTML=html;
  const bar=document.createElement('div');bar.className='campaign-joinbar';bar.innerHTML='<button class="campaign-cta" type="button" onclick="openSupportChooser()">Подржи кампању</button>';document.body.appendChild(bar);
