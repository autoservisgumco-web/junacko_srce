<style>
/* Детаљ кампање — визуелни шаблон усклађен са детаљем акције */
body.campaign-page{background:#f7f8fa;overflow-x:hidden}

.campaign-item{border:1px solid #e5eaf0;border-radius:13px;padding:17px;background:#fff}

.campaign-item p{font-size:14px;line-height:1.55;color:#64748b}
.campaign-item .item-meta{font-size:12px;color:#64748b;margin-top:8px}
.campaign-progress-note{font-size:13px;color:#64748b;margin-top:7px}
.campaign-joinbar{position:fixed;z-index:120;left:0;right:0;bottom:70px;display:flex;align-items:center;justify-content:center;padding:10px  max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:transparent;pointer-events:none}.campaign-joinbar .campaign-cta{width:min(650px,100%);min-height:50px;box-shadow:0 8px 25px #061a3540;pointer-events:auto;font-size:16px}
.campaign-joinbar .campaign-cta{white-space:nowrap}

/* Interaktivne prijave kampanje */.support-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.support-launch{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:15px;border:1px solid #dce4ee;border-radius:13px;background:#f8fbff;color:#172033;cursor:pointer}.support-launch:hover{border-color:#2166f3;background:#f1f6ff}.support-icon{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:11px;background:#e6efff;color:#174ea6;font-size:20px}.support-launch strong,.support-launch small{display:block}.support-launch small{color:#64748b;margin-top:4px;line-height:1.4}.campaign-overlay{display:none;position:fixed;inset:0;z-index:200;background:#061a35a8;align-items:flex-end;justify-content:center}.campaign-overlay.open{display:flex}.campaign-sheet{width:min(100%,650px);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 45px #061a3530}.sheet-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.sheet-head h2{margin:0;font-size:23px}.sheet-head p{margin:6px 0 0;color:#64748b;font-size:14px}.sheet-close{border:0;border-radius:50%;width:38px;height:38px;font-size:23px;background:#eef2f7;cursor:pointer}.support-form{display:grid;gap:12px}.support-form label{display:grid;gap:6px;font-size:13px;font-weight:750;color:#344054}.support-form input,.support-form select,.support-form textarea{box-sizing:border-box;width:100%;border:1px solid #d7dee8;border-radius:10px;padding:12px;font:inherit;font-size:15px;background:#fff}.support-form textarea{min-height:85px}.support-form button{border:0;border-radius:11px;padding:13px;background:#d71920;color:white;font-weight:800;cursor:pointer}.prototype-note{padding:10px 12px;background:#fff7e8;color:#81540b;border:1px solid #f5dfb5;border-radius:10px;font-size:12px;line-height:1.5}@media(max-width:560px){.support-options{grid-template-columns:1fr}.campaign-sheet{padding:19px 16px calc(20px + env(safe-area-inset-bottom))}}
/* Sheet is lifted above the mobile navigation; its content scrolls independently. */
.campaign-overlay{align-items:flex-end;padding:12px 12px 76px;box-sizing:border-box;overflow:hidden}
.campaign-sheet{display:flex;flex-direction:column;width:min(100%,650px);max-height:min(82dvh,760px);overflow:hidden;margin:0 auto;border-radius:22px;padding:18px 20px 12px}
.campaign-sheet .sheet-head{flex:none;position:sticky;top:0;background:#fff;z-index:2;padding-bottom:10px}

</style>

<script>document.getElementById('year').textContent=new Date().getFullYear();const menu=document.getElementById('sideMenu'),back=document.getElementById('menuBackdrop');function closeSideMenu(){menu.classList.remove('open');back.classList.remove('open');menu.setAttribute('aria-hidden','true');setTimeout(()=>back.hidden=true,260)}document.getElementById('openMenu').addEventListener('click',()=>{back.hidden=false;menu.setAttribute('aria-hidden','false');requestAnimationFrame(()=>{back.classList.add('open');menu.classList.add('open')})});document.getElementById('closeMenu').addEventListener('click',closeSideMenu);back.addEventListener('click',closeSideMenu);</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/database.js"></script><script src="/donation-types.js"></script><script>const db=window.db;const param=new URLSearchParams(location.search).get("slug");</script>
<script>(async function(){
 const root=document.getElementById('campaignDetail');
 let debugStage='Покретање скрипте';
 const debugPanel=document.createElement('pre');
 debugPanel.id='campaignDebugPanel';
 debugPanel.style.cssText='display:none;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff1f0;color:#8b1e18;border:2px solid #d92d20;border-radius:12px;padding:14px;margin:14px;font:12px/1.5 monospace;max-height:45vh;overflow:auto';
 root.parentNode.insertBefore(debugPanel,root);
 const showDebug=(kind,error)=>{
  const nl=String.fromCharCode(10);
  const detail=[kind,'Фаза: '+debugStage,'Порука: '+(error?.message||String(error)),'Име: '+(error?.name||'—'),'Код: '+(error?.code||'—'),'Детаљи: '+(error?.details||'—'),'Hint: '+(error?.hint||'—'),'Stack: '+(error?.stack||'—')].join(nl);
  debugPanel.style.display='block';debugPanel.textContent='ТЕХНИЧКА ГРЕШКА — пошаљи ми овај текст'+nl+nl+detail;
  console.error('[Campaign diagnostic]',detail);
 };
 window.addEventListener('error',event=>showDebug('JavaScript грешка',event.error||event.message));
 window.addEventListener('unhandledrejection',event=>showDebug('Необрађена Promise грешка',event.reason));
 const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 const param=new URLSearchParams(location.search).get('slug');
 const db=window.db;
 debugStage='Провера адресе кампање';
 if(!param){root.innerHTML='<div class="campaign-empty">Није изабрана кампања.</div>';return;}
 try{
  debugStage='Провера везе са Supabase';
  if(!db)throw new Error('База података није доступна.');
  const query=param.match(/^[0-9a-f-]{36}$/i)?db.from('campaigns').select('*').eq('id',param):db.from('campaigns').select('*').eq('slug',param);
  debugStage='Читање реда из campaigns табеле';
  const response=await Promise.race([query.eq('is_published',true).maybeSingle(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Истекло је време учитавања кампање.')),12000))]);
  if(response.error)throw response.error;
  const c=response.data;
  if(!c){root.innerHTML='<div class="campaign-empty">Кампања није пронађена или није објављена.</div>';return;}
  debugStage='Припрема HTML приказа кампање';
  document.title=c.title+' — Одговорна Плана';
  const status=({active:'Активна',draft:'У припреми',completed:'Завршена',paused:'Паузирана',planned:'Планирана'})[c.status]||'Објављена';
  const cover=c.hero_image?(String(c.hero_image).startsWith('http')?c.hero_image:'/'+String(c.hero_image).replace(/^\//,'')):'';
  let html='<div class="campaign-cover"'+(cover?' style="background-image:url(&quot;'+esc(cover)+'&quot;)"':'')+'><span class="campaign-status">'+status+'</span></div>';
  html+='<section class="campaign-overview"><div class="campaign-main"><span class="campaign-kind">КАМПАЊА</span><h1>'+esc(c.title)+'</h1><p class="campaign-summary">'+esc(c.intro_text||c.description||'')+'</p></div><aside class="campaign-progress"><strong>'+Math.max(0,Math.min(100,Number(c.progress_percent)||0))+'%</strong><small>Напредак кампање</small><div class="campaign-progress-track"><span style="width:'+Math.max(0,Math.min(100,Number(c.progress_percent)||0))+'%"></span></div></aside></section>';
  const addSection=(heading,value)=>{if(value)html+='<section class="campaign-section"><h2>'+heading+'</h2><p>'+esc(value)+'</p></section>';};
  addSection('Проблем који решавамо',c.problem_text);
  addSection('Циљ кампање',c.goal_text||c.goal);
  addSection('Како ћемо деловати',c.plan_text);
  if(!c.problem_text&&!c.goal_text&&!c.goal&&!c.plan_text&&c.description)addSection('О кампањи',c.description);
  html+='<section class="campaign-section campaign-start-action"><h2>Имаш идеју за конкретну акцију?</h2><p>Предложи шта можемо да урадимо у оквиру ове кампање. Твој предлог ће бити повезан са кампањом „'+esc(c.title)+'“.</p><p style="margin-top:16px"><button type="button" class="campaign-cta" id="openCampaignProposal">＋ Додај акцију за ову кампању</button></p></section>';
  html+='<section class="campaign-section"><h2>Кампања се гради заједно</h2><p>Имаш предлог, знање или време? Постани део заједничког рада.</p><p style="margin-top:12px"><a href="/kampanje.html">Погледај све кампање →</a></p></section>';

  debugStage='Припрема начина учешћа и формулара';

   let overlay=document.getElementById('campaignOverlay');

   overlay.querySelector('#sheetTitle').textContent=title;overlay.querySelector('#sheetSubtitle').textContent=subtitle;overlay.querySelector('#sheetBody').innerHTML=body;overlay.classList.add('open');document.body.style.overflow='hidden';overlay.querySelector('#closeCampaignSheet').onclick=closeSheet;
  };

   {id:'volunteer',icon:'fa-hands-helping',title:'Волонтирање',desc:'Поклони време и знање'},
   {id:'adoption',icon:'fa-dog',title:'Удомљавање паса',desc:'Удоми пса или му помози да нађе дом'},
   {id:'action',icon:'fa-lightbulb',title:'Покрени своју акцију',desc:'Предложи идеју и окупи људе'}
  ];
  const formShell=(fields)=>'<form class="support-form" id="campaignSupportForm">'+fields+'<label><span><input type="checkbox" name="consent" required style="width:auto"> Сагласан/сагласна сам да се моји подаци користе ради контакта у вези са овом пријавом.</span></label><p class="support-submit-message" role="status" aria-live="polite"></p><button type="submit">Пошаљи пријаву</button></form>';
  const commonFields='<label>Име и презиме *<input name="name" required minlength="2" maxlength="120"></label><label>Телефон или Viber *<input name="phone" required type="tel" minlength="6" maxlength="40"></label><label>Место<input name="place" maxlength="160"></label>';
  function showSupportForm(type){
   let title='',intro='',fields='',submissionType='help',supportType='';
   if(type==='finance'){
    title='Финансијска подршка';intro='Пријави намеру да финансијски подржиш кампању. Администратор ће прегледати пријаву и доставити ти проверене податке за уплату.';
    supportType='Финансијска подршка';fields=commonFields+'<label>Износ који желиш да уплатиш (динари)<input name="amount" type="number" min="1" step="1" required></label><label>Начин уплате који ти одговара<select name="payment_method" required><option value="">Изабери</option><option>Уплата на рачун</option><option>PayPal</option><option>IPS QR код</option><option>Договор са удружењем</option></select></label><label>Напомена (опционо)<textarea name="note" maxlength="1500"></textarea></label>';
   }else if(type==='donation'){
    title='Донација ствари и потрепштина';intro='Не мораш ништа да купујеш. Наведи шта већ имаш и можеш да поклониш или обезбедиш за потребе ове кампање.';
    supportType='Донације за кампању';fields=commonFields+'<label>Шта можеш да поклониш или обезбедиш? *<input name="item" required maxlength="180" placeholder="Нпр. храна, посуде, опрема..."></label><label>Количина<input name="quantity" maxlength="100" placeholder="Нпр. 2 џака, 5 комада..."></label><label>Стање ствари<select name="condition"><option>Ново</option><option>Половно, исправно и употребљиво</option><option>Није применљиво</option></select></label><label>Како можеш да доставиш?<select name="delivery"><option>Могу лично да донесем</option><option>Потребан ми је договор о преузимању</option><option>Могу да обезбедим превоз</option></select></label><label>Додатна напомена<textarea name="note" maxlength="1500"></textarea></label>';
   }else if(type==='association'){
    title='Помоћ удружењу';intro='Помози удружењу у редовном раду. Можеш да понудиш ствар, материјал, услугу, новчану подршку или други вид помоћи.';
    supportType='Помоћ удружењу';fields=commonFields+'<label>Какву помоћ можеш да понудиш? *<select name="help_kind" required><option value="">Изабери</option><option>Храна и потрепштине</option><option>Опрема и материјал</option><option>Услуга или стручно знање</option><option>Финансијска помоћ</option><option>Организациона и друга помоћ</option></select></label><label>Опиши шта конкретно можеш да обезбедиш или урадиш. *<textarea name="details" required minlength="5" maxlength="2500"></textarea></label><label>Колико често можеш да помогнеш?<select name="frequency"><option>Једнократно</option><option>Повремено</option><option>Редовно</option><option>По договору</option></select></label>';

   }else if(type==='adoption'){
    title='Удомљавање паса';intro='Изабери да ли желиш да пружиш псу дом или тражиш сигуран дом за пса о коме бринеш.';
    supportType='Удомљавање паса';submissionType='adoption';fields=commonFields+'<label>Шта желиш да урадиш? *<select name="adoption_intent" id="adoptionIntent" required><option value="">Изабери</option><option value="Желим да удомим пса">Желим да удомим пса</option><option value="Тражим дом за пса или штенце">Тражим дом за пса или штенце</option></select></label><div id="adoptionExtra"></div>';
   }else if(type==='action'){
    title='Покрени своју акцију';intro='Предложи конкретну акцију која доприноси циљевима кампање. Предлог прво прегледа администратор.';
    supportType='Предлог акције';submissionType='action';
    fields='<label>Назив акције *<input name="title" required maxlength="140"></label><label>Место акције<input name="location" maxlength="180"></label><label>Шта желиш да урадиш? *<textarea name="details" required minlength="10" maxlength="3000"></textarea></label><label>Шта желиш да постигнеш?<textarea name="goal" maxlength="1500"></textarea></label>'+commonFields+'<label>Када би желео/желела да се акција одржи?<input name="action_date" type="date"></label><label>Шта је потребно за реализацију?<textarea name="needs" maxlength="1500"></textarea></label><label>Како други могу да се прикључе?<textarea name="join_info" maxlength="1000"></textarea></label>';
   }
   openSheet(title,intro,formShell(fields));
   const form=document.getElementById('campaignSupportForm');
   if(type==='adoption'){
    const intent=form.elements.adoption_intent,extra=document.getElementById('adoptionExtra');
    const updateAdoption=()=>{extra.innerHTML=intent.value==='Желим да удомим пса'?'<label>Какве услове можеш да обезбедиш псу?<textarea name="home_conditions" required minlength="5" maxlength="1500"></textarea></label><label>Да ли си раније имао/имала пса?<select name="dog_experience"><option>Да</option><option>Не</option></select></label><label>Да ли већ имаш друге животиње?<input name="other_animals" maxlength="180"></label>':intent.value==='Тражим дом за пса или штенце'?'<label>Колико паса/штеца тражи дом? *<input name="dog_count" required maxlength="50"></label><label>Старост и пол паса<textarea name="dog_age_sex" required maxlength="500"></textarea></label><label>Опис пса/штеца и околности<textarea name="dog_description" required minlength="5" maxlength="1800"></textarea></label><label>Где се пас тренутно налази? *<input name="dog_location" required maxlength="180"></label>':'';};
    intent.addEventListener('change',updateAdoption);
   }
   form.addEventListener('submit',async e=>{
    e.preventDefault();if(!form.reportValidity())return;
    const button=form.querySelector('button[type="submit"]'),message=form.querySelector('.support-submit-message'),fd=new FormData(form);
    button.disabled=true;button.textContent='Шаљем пријаву…';
    const data={};fd.forEach((v,k)=>{if(k!=='consent'&&k!=='name'&&k!=='phone'&&k!=='place')data[k]=v;});
    const person=String(fd.get('name')||'').trim(),phone=String(fd.get('phone')||'').trim(),place=String(fd.get('place')||'').trim();
    const subject=type==='action'?String(fd.get('title')||'').trim():supportType+' — '+c.title;
    const description=type==='action'?String(fd.get('details')||'').trim():'Пријава за кампању „'+c.title+'“. Подаци из формулара: '+JSON.stringify(data);
    const payload={submission_type:submissionType,title:subject,description:description,full_name:person,phone:phone,viber_phone:phone,location:place||null,support_type:supportType,social_links:{source:'kampanja.html',kind:'campaign_support',campaign_id:c.id,campaign_title:c.title,form_type:type,form_data:data},status:'new'};
    try{
     const result=await db.from('civic_submissions').insert(payload);
     if(result.error)throw result.error;
     form.innerHTML='<div style="padding:12px 0;color:#16834b;font-weight:750" role="status">Пријава је успешно сачувана. Стигла је у Контролни центар и биће прегледана. Хвала ти!</div><button type="button" id="supportDone">Затвори</button>';
     document.getElementById('supportDone').onclick=closeSheet;
    }catch(err){console.error('Пријава није сачувана:',err);message.textContent='Пријава није сачувана. Покушај поново.';message.style.color='#b42318';button.disabled=false;button.textContent='Пошаљи пријаву';}
   });
  }
  window.openCampaignActionProposal=()=>showSupportForm('action');
  window.openSupportChooser=()=>{
   const cards=categories.map(x=>'<button class="support-launch" type="button" onclick="showCampaignSupportForm(\\''+x.id+'\\')"><span class="support-icon"><i class="fas '+x.icon+'"></i></span><span><strong>'+x.title+'</strong><small>'+x.desc+'</small></span></button>').join('');
   openSheet('Како желиш да се укључиш?','Изабери начин на који можеш да помогнеш кампањи.', '<div class="support-options">'+cards+'</div>');
  };
  window.showCampaignSupportForm=showSupportForm;
  const oldProposal=document.getElementById('openCampaignProposal');
  if(oldProposal)oldProposal.addEventListener('click',()=>showSupportForm('action'));
  const bar=document.createElement('div');bar.className='campaign-joinbar';bar.innerHTML='<button class="campaign-cta" type="button" id="supportCampaignButton">Подржи кампању</button>';document.body.appendChild(bar);
  document.getElementById('supportCampaignButton').addEventListener('click',window.openSupportChooser);
 }catch(error){showDebug('Грешка при учитавању кампање',error);root.innerHTML='<div class="campaign-empty">Детаљи кампање нису учитани: '+esc(error.message||String(error))+'</div>';}
})();</script>  <script src="/bottom-nav.js"></script>
