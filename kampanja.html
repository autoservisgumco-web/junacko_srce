<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script src="/database.js"></script><script src="/donation-types.js"></script><script>const db=window.db;const param=new URLSearchParams(location.search).get("slug");</script>
<script>(async function(){
 const root=document.getElementById('campaignDetail');
 let debugStage='Покретање скрипте';
 const debugPanel=document.createElement('pre');
 debugPanel.id='campaignDebugPanel';
 debugPanel.style.cssText='display:none;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff1f0;color:#8b1e18;border:2px solid #d92d20;border-radius:12px;padding:14px;margin:14px;font:12px/1.5 monospace;max-height:45vh;overflow:auto';
 root.parentNode.insertBefore(debugPanel,root);
 const showDebug=(kind,error)=>{
  const nl=String.fromCharCode(10);
  const detail=[kind,'Фаза: '+debugStage,'Порука: '+(error?.message||String(error)),'Име: '+(error?.name||'—'),'Код: '+(error?.code||'—'),'Детаљи: '+(error?.details||'—'),'Hint: '+(error?.hint||'—'),'Stack: '+(error?.stack||'—')].join(nl);
  debugPanel.style.display='block';debugPanel.textContent='ТЕХНИЧКА ГРЕШКА — пошаљи ми овај текст'+nl+nl+detail;
  console.error('[Campaign diagnostic]',detail);
 };
 window.addEventListener('error',event=>showDebug('JavaScript грешка',event.error||event.message));
 window.addEventListener('unhandledrejection',event=>showDebug('Необрађена Promise грешка',event.reason));
 const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 const param=new URLSearchParams(location.search).get('slug');
 const db=window.db;
 debugStage='Провера адресе кампање';
 if(!param){root.innerHTML='<div class="campaign-empty">Није изабрана кампања.</div>';return;}
 try{
  debugStage='Провера везе са Supabase';
  if(!db)throw new Error('База података није доступна.');
  const query=param.match(/^[0-9a-f-]{36}$/i)?db.from('campaigns').select('*').eq('id',param):db.from('campaigns').select('*').eq('slug',param);
  debugStage='Читање реда из campaigns табеле';
  const response=await Promise.race([query.eq('is_published',true).maybeSingle(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Истекло је време учитавања кампање.')),12000))]);
  if(response.error)throw response.error;
  const c=response.data;
  if(!c){root.innerHTML='<div class="campaign-empty">Кампања није пронађена или није објављена.</div>';return;}
  debugStage='Припрема HTML приказа кампање';
  document.title=c.title+' — Одговорна Плана';
  const status=({active:'Активна кампања',draft:'Кампања у припреми',completed:'Завршена кампања',paused:'Паузирана кампања',planned:'Планирана кампања'})[String(c.status||'').toLowerCase()]||'Објављена кампања';
  const cover=c.hero_image?(String(c.hero_image).startsWith('http')?c.hero_image:'https://hmfeizkmpmxcnzhwxgbn.supabase.co/storage/v1/object/public/akcije/'+String(c.hero_image).replace(/^\//,'')):'';
  const intro=c.intro_text||c.description||'';
  let html='<section class="campaign-cover"'+(cover?' style="background-image:url(&quot;'+esc(cover)+'&quot;)"':'')+'><span class="campaign-status">'+status+'</span><div class="campaign-hero-copy"><span class="campaign-kind">КАМПАЊА</span><h1>'+esc(c.title)+'</h1><p>'+esc(intro)+'</p></div></section>';

  debugStage='Учитавање садржаја кампање из базе';
  const [sectionsRes,goalsRes,activitiesRes]=await Promise.all([
   db.from('campaign_sections').select('*').eq('campaign_id',c.id).eq('is_active',true).order('order_number'),
   db.from('campaign_goals').select('*').eq('campaign_id',c.id).eq('is_active',true).order('order_number'),
   db.from('campaign_activities').select('*').eq('campaign_id',c.id).eq('is_published',true).order('order_number')
  ]);
  if(sectionsRes.error)throw sectionsRes.error;
  if(goalsRes.error)throw goalsRes.error;
  if(activitiesRes.error)throw activitiesRes.error;
  const sections=sectionsRes.data||[],goals=goalsRes.data||[],activities=activitiesRes.data||[];
  const addSection=(heading,value,cls='')=>{if(value)html+='<section class="campaign-section '+cls+'"><h2>'+esc(heading)+'</h2><p>'+esc(value)+'</p></section>';};
  html+='<section class="campaign-section campaign-content-intro"><h2>О кампањи</h2><p>'+esc(c.problem_text||c.description||'')+'</p></section>';
  if(goals.length){
   html+='<section class="campaign-section campaign-goals"><h2>Циљеви кампање</h2><ul class="campaign-goal-list">'+goals.map(g=>'<li><strong>'+esc(g.title)+'</strong>'+(g.description?'<p>'+esc(g.description)+'</p>':'')+'</li>').join('')+'</ul></section>';
  }
  if(sections.length){
   html+='<section class="campaign-story"><div class="campaign-story-heading"><span>НАША ПРИЧА</span><h2>Од проблема до решења</h2></div><div class="campaign-story-list">'+sections.map((item,index)=>'<article class="campaign-story-item"><span class="campaign-story-number">'+String(index+1).padStart(2,'0')+'</span><div><h3>'+esc(item.title)+'</h3>'+(item.subtitle?'<h4>'+esc(item.subtitle)+'</h4>':'')+'<p>'+esc(item.content||'')+'</p></div></article>').join('')+'</div></section>';
  }
  if(activities.length){
   html+='<section class="campaign-section campaign-activities"><h2>Шта је до сада урађено</h2><div class="campaign-activity-list">'+activities.map(a=>'<article class="campaign-activity-item"><span class="campaign-activity-status">'+(a.status==='completed'?'Завршено':a.status==='in_progress'?'У току':'Објављено')+'</span><div><h3>'+esc(a.title)+'</h3>'+(a.description?'<p>'+esc(a.description)+'</p>':'')+'</div></article>').join('')+'</div></section>';
  }
  html+='<section class="campaign-section campaign-start-action"><h2>Имаш идеју за конкретну акцију?</h2><p>Предложи шта можемо да урадимо у оквиру ове кампање. Твој предлог ће бити повезан са кампањом „'+esc(c.title)+'“.</p><p style="margin-top:16px"><button type="button" class="campaign-cta" id="openCampaignProposal">＋ Додај акцију</button></p></section>';
  html+='<section class="campaign-section"><h2>Кампања се гради заједно</h2><p>Имаш предлог, знање или време? Постани део заједничког рада.</p><p style="margin-top:12px"><a href="/kampanje.html">Погледај све кампање →</a></p></section>';
  debugStage='Приказ кампање на страници';
  root.innerHTML=html;
  debugStage='Припрема начина учешћа и формулара';
  const openSheet=(title,subtitle,body)=>{
   let overlay=document.getElementById('campaignOverlay');
   if(!overlay){overlay=document.createElement('div');overlay.id='campaignOverlay';overlay.className='campaign-overlay';overlay.innerHTML='<section class="campaign-sheet" role="dialog" aria-modal="true"><div class="sheet-head"><div><h2 id="sheetTitle"></h2><p id="sheetSubtitle"></p></div><button class="sheet-close" type="button" id="closeCampaignSheet" aria-label="Затвори">×</button></div><div id="sheetBody"></div></section>';overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet();});document.body.appendChild(overlay);}
   overlay.querySelector('#sheetTitle').textContent=title;overlay.querySelector('#sheetSubtitle').textContent=subtitle;overlay.querySelector('#sheetBody').innerHTML=body;overlay.classList.add('open');document.body.style.overflow='hidden';overlay.querySelector('#closeCampaignSheet').onclick=closeSheet;
  };
  function closeSheet(){document.getElementById('campaignOverlay')?.classList.remove('open');document.body.style.overflow='';}
  window.closeCampaignSheet=closeSheet;
  const commonFields='<label>Име и презиме *<input name="name" required minlength="2" maxlength="120"></label><label>Телефон или Viber *<input name="phone" required type="tel" minlength="6" maxlength="40"></label><label>Место<input name="place" maxlength="160"></label>';
  const formShell=fields=>'<form class="support-form" id="campaignSupportForm">'+commonFields+fields+'<label><span><input type="checkbox" name="consent" required style="width:auto"> Сагласан/сагласна сам да се моји подаци користе ради контакта у вези са овом пријавом.</span></label><p class="support-submit-message" role="status" aria-live="polite"></p><button type="submit">Пошаљи пријаву</button></form>';
  const fieldName=v=>String(v||'field').replace(/[^a-zA-Z0-9_-]/g,'_');
  const renderField=f=>{
   const key=fieldName(f.field_key),label=esc(f.label||f.field_key||'Додатне информације'),req=f.is_required?' required':'',mark=f.is_required?' *':'',ph=esc(f.placeholder||''),type=f.field_type||'text';
   if(type==='textarea')return '<label>'+label+mark+'<textarea name="'+key+'"'+req+' maxlength="3000" placeholder="'+ph+'"></textarea></label>';
   if(['select','radio','checkbox_group'].includes(type)){const opts=Array.isArray(f.options)?f.options:[];return '<label>'+label+mark+'<select name="'+key+'"'+req+'><option value="">Изабери</option>'+opts.map(o=>{const v=typeof o==='string'?o:(o.value??o.label??''),t=typeof o==='string'?o:(o.label??o.value??'');return '<option value="'+esc(v)+'">'+esc(t)+'</option>';}).join('')+'</select></label>';}
   const inputType=type==='phone'?'tel':type==='email'?'email':type==='number'?'number':type==='date'?'date':type==='url'?'url':'text';
   return '<label>'+label+mark+'<input name="'+key+'" type="'+inputType+'"'+req+' maxlength="500" placeholder="'+ph+'"></label>';
  };
  async function showSupportForm(option){
   const fr=await db.from('support_option_fields').select('*').eq('support_option_id',option.id).eq('is_active',true).order('order_number');if(fr.error)throw fr.error;
   const fields=fr.data||[],extra=fields.map(renderField).join('')+(option.allow_custom_message!==false?'<label>Додатна порука (опционо)<textarea name="custom_message" maxlength="2000"></textarea></label>':'');
   openSheet(option.label||'Подршка кампањи',option.description||option.short_description||'Изабери како можеш да помогнеш овој кампањи.',formShell(extra));
   const form=document.getElementById('campaignSupportForm');
   form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const fd=new FormData(form),btn=form.querySelector('button[type="submit"]'),msg=form.querySelector('.support-submit-message');btn.disabled=true;btn.textContent='Шаљем пријаву…';
    const name=String(fd.get('name')||'').trim(),phone=String(fd.get('phone')||'').trim(),place=String(fd.get('place')||'').trim(),data={};fd.forEach((v,k)=>{if(!['consent','name','phone','place'].includes(k))data[k]=v;});
    const details=fields.map(f=>{const v=data[fieldName(f.field_key)];return v?String(f.label||f.field_key)+': '+v:null;}).filter(Boolean);if(data.custom_message)details.push('Напомена: '+data.custom_message);
    const result=await db.from('civic_submissions').insert({submission_type:'help',title:(option.label||'Подршка')+' — '+c.title,description:'Пријава за кампању „'+c.title+'“.\n'+details.join('\n'),full_name:name,phone,viber_phone:phone,location:place||null,support_type:option.label,social_links:{source:'kampanja.html',kind:'campaign_support',campaign_id:c.id,campaign_title:c.title,support_option_id:option.id,support_option_type:option.type,form_data:data},status:'new'});
    if(result.error){console.error(result.error);msg.textContent='Пријава није послата. Покушај поново.';msg.style.color='#b42318';btn.disabled=false;btn.textContent='Пошаљи пријаву';return;}
    form.innerHTML='<p role="status" style="color:#16834b;font-weight:750">Пријава је успешно сачувана. Хвала ти!</p><button type="button" id="supportDone">Затвори</button>';document.getElementById('supportDone').onclick=closeSheet;
   });
  }
  function openActionProposalForm(){
   const fields='<label>Назив акције *<input name="title" required maxlength="140"></label><label>Место акције<input name="location" maxlength="180"></label><label>Шта желиш да урадиш? *<textarea name="details" required minlength="10" maxlength="3000"></textarea></label><label>Шта је потребно за реализацију?<textarea name="needs" maxlength="1500"></textarea></label>';
   openSheet('Покрени своју акцију','Предложи конкретну акцију у оквиру кампање „'+c.title+'“.',formShell(fields));
   const form=document.getElementById('campaignSupportForm');form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;const fd=new FormData(form),btn=form.querySelector('button[type="submit"]'),msg=form.querySelector('.support-submit-message');btn.disabled=true;btn.textContent='Шаљем предлог…';const result=await db.from('action_proposals').insert({title:String(fd.get('title')||'').trim(),description:String(fd.get('details')||'').trim(),location:String(fd.get('location')||'').trim()||null,proposer_name:String(fd.get('name')||'').trim(),proposer_phone:String(fd.get('phone')||'').trim(),proposer_viber:String(fd.get('phone')||'').trim(),proposer_social:{source:'kampanja.html',campaign_id:c.id,campaign_title:c.title,needs:String(fd.get('needs')||'')},campaign_id:c.id,status:'pending'});if(result.error){msg.textContent='Предлог није послат. Покушај поново.';msg.style.color='#b42318';btn.disabled=false;btn.textContent='Пошаљи пријаву';return;}form.innerHTML='<p role="status">Предлог је успешно послат. Хвала ти!</p><button type="button" id="supportDone">Затвори</button>';document.getElementById('supportDone').onclick=closeSheet;});
  }
  window.openCampaignActionProposal=openActionProposalForm;
  window.openSupportChooser=async()=>{
   try{
    const [optionsRes,donationRes,itemsRes]=await Promise.all([
     db.from('support_options').select('id,label,type,short_description,description,icon,order_number,allow_custom_message').eq('campaign_id',c.id).eq('is_active',true).eq('is_public',true).eq('approval_status','approved').order('order_number'),
     db.from('campaign_donations').select('*').eq('campaign_id',c.id).eq('is_active',true).maybeSingle(),
     db.from('campaign_donation_items').select('*').eq('campaign_id',c.id).eq('is_active',true).order('order_number')
    ]);
    if(optionsRes.error)throw optionsRes.error;
    if(donationRes.error)throw donationRes.error;
    if(itemsRes.error)throw itemsRes.error;
    const options=(optionsRes.data||[]).filter(o=>o.type!=='donation'),settings=donationRes.data,items=itemsRes.data||[];
    const donationAvailable=!!settings&&(!!(settings.recipient_name||settings.bank_account||settings.paypal_email||settings.paypal_link)||items.length>0||!!(settings.contact_phone||settings.contact_email));
    const cards=(donationAvailable?'<button class="support-launch" type="button" data-campaign-donation><span class="support-icon"><i class="fas fa-heart"></i></span><span><strong>Донирај новац</strong><small>Уплати донацију преко банке или PayPal-а.</small></span></button>':'')+options.map(o=>'<button class="support-launch" type="button" data-support-option="'+esc(o.id)+'"><span class="support-icon"><i class="fas '+esc(o.icon||'fa-hand-holding-heart')+'"></i></span><span><strong>'+esc(o.label)+'</strong><small>'+esc(o.short_description||o.description||'Погледај како можеш да помогнеш.')+'</small></span></button>').join('');
    if(!cards){openSheet('Подржи кампању','За ову кампању начини подршке још нису објављени.','<p>Тренутно нема објављених начина подршке. Можеш да предложиш акцију.</p>');return;}
    openSheet('Подржи кампању','Изабери како желиш да помогнеш кампањи „'+c.title+'“.','<div class="support-options">'+cards+'</div>');
    const donationButton=document.querySelector('[data-campaign-donation]');
    if(donationButton)donationButton.addEventListener('click',()=>{
      const panel=window.DonationTypes?window.DonationTypes.renderPanel(settings,items):'<p>Приказ донација тренутно није доступан.</p>';
      openSheet('Донације за кампању „'+c.title+'“','Изабери износ или начин на који можеш да помогнеш.',panel);
    });
    document.querySelectorAll('[data-support-option]').forEach(b=>b.addEventListener('click',()=>{const o=options.find(x=>x.id===b.dataset.supportOption);if(o)showSupportForm(o).catch(err=>{console.error(err);openSheet('Грешка','Образац тренутно није доступан.','Покушај поново касније.');});}));
   }catch(err){console.error(err);openSheet('Начини подршке','Тренутно није могуће учитати начине подршке.','Покушај поново касније.');}
  };
const oldProposal=document.getElementById('openCampaignProposal');
  if(oldProposal)oldProposal.addEventListener('click',openActionProposalForm);
  const bar=document.createElement('div');bar.className='campaign-joinbar';bar.innerHTML='<button class="campaign-cta" type="button" id="supportCampaignButton">Подржи кампању</button>';document.body.appendChild(bar);
  document.getElementById('supportCampaignButton').addEventListener('click',window.openSupportChooser);
 }catch(error){showDebug('Грешка при учитавању кампање',error);root.innerHTML='<div class="campaign-empty">Детаљи кампање нису учитани: '+esc(error.message||String(error))+'</div>';}
})();</script>  <script src="/bottom-nav.js"></script>
<script src="/shared-proposal-modal.js"></script>
