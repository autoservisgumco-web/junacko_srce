name: Deploy Napusteni psi PWA

on:
  push:
    branches: [radna-verzija]
    paths:
      - 'odgovorna-plana/napusteni-psi-pwa/**'
      - '.github/workflows/deploy-napusteni-psi.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./odgovorna-plana/napusteni-psi-pwa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
