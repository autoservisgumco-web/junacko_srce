<script>document.getElementById('year').textContent=new Date().getFullYear();const menu=document.getElementById('sideMenu'),back=document.getElementById('menuBackdrop');function closeSideMenu(){menu.classList.remove('open');back.classList.remove('open');menu.setAttribute('aria-hidden','true');setTimeout(()=>back.hidden=true,260)}document.getElementById('openMenu').addEventListener('click',()=>{back.hidden=false;menu.setAttribute('aria-hidden','false');requestAnimationFrame(()=>{back.classList.add('open');menu.classList.add('open')})});document.getElementById('closeMenu').addEventListener('click',closeSideMenu);back.addEventListener('click',closeSideMenu);</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://hmfeizkmpmxcnzhwxgbn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImhtZmVpemttcG14Y256aHd4Z2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMjkyNzgsImV4cCI6MjEwODkwNTI3OH0.oTZopOJEGUnxK69BOYPP11CQoGrLqUJowqpPU2uiY-4');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const param=new URLSearchParams(location.search).get('slug');</script>
<script>(async()=>{const root=document.getElementById('actionDetail');if(!param){root.innerHTML='<div class="content-empty">Није изабрана акција.</div>';return;}try{let q=db.from('actions').select('*').eq('is_published',true);q=param.match(/^[0-9a-f-]{36}$/i)?q.eq('id',param):q.eq('slug',param);const {data:a,error}=await q.maybeSingle();if(error)throw error;if(!a){root.innerHTML='<div class="content-empty">Акција није пронађена или није објављена.</div>';return;}document.title=a.title+' — Одговорна Плана';let campaign=null;if(a.campaign_id){const r=await db.from('campaigns').select('title,slug,id').eq('id',a.campaign_id).eq('is_published',true).maybeSingle();if(r.error)throw r.error;campaign=r.data;}let html='<div class="content-kicker">АКЦИЈА</div><section class="content-detail-hero"><div><span class="content-tag">'+esc(a.status||'Објављена')+'</span><h1 class="content-title">'+esc(a.title)+'</h1><p class="content-lead">'+esc(a.summary||a.intro||'')+'</p>'+(a.location?'<p>📍 '+esc(a.location)+'</p>':'')+(a.action_date?'<p>📅 '+esc(a.action_date)+'</p>':'')+(campaign?'<p><a class="content-back" href="kampanja.html?slug='+encodeURIComponent(campaign.slug||campaign.id)+'">Кампања: '+esc(campaign.title)+'</a></p>':'')+'</div>'+(a.image_url?'<img src="'+esc(a.image_url)+'" alt="'+esc(a.title)+'">':'')+'</section>';for(const [t,v] of [['Зашто покрећемо акцију',a.reason],['Циљ акције',a.goal],['Шта планирамо',a.activities],['Како можеш да учествујеш',a.participation],['Шта је потребно',a.materials],['Место и време окупљања',a.meeting_info],['Резултати',a.results],['Више о акцији',a.description]])if(v)html+='<section class="content-detail-box"><h2>'+t+'</h2><p>'+esc(Array.isArray(v)?v.join('\n'):typeof v==='object'?JSON.stringify(v,null,2):v)+'</p></section>';if(a.call_to_action)html+='<section class="content-detail-box"><h2>Прикључи се</h2><p>'+esc(a.call_to_action)+'</p></section>';root.innerHTML=html;}catch(e){console.error(e);root.innerHTML='<div class="content-empty">Детаљи акције тренутно нису доступни.</div>';}})();</script>  <script src="bottom-nav.js"></script>
