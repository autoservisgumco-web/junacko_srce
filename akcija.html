<!doctype html>
<html lang="sr-Cyrl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061A35">
<title>Акција — Одговорна Плана</title>
<style>
:root{--navy:#061A35;--blue:#2166F3;--sky:#F1F5F9;--ink:#142844;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--sky);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{height:76px;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 max(6vw,22px)}
header a{color:#fff;text-decoration:none;font-weight:750}.brand{font-size:20px;font-style:italic}
main{max-width:900px;margin:42px auto;padding:0 20px 60px}
.back{display:inline-block;color:#2166F3;text-decoration:none;font-weight:700;margin-bottom:22px}
.hero{background:linear-gradient(120deg,#061A35,#0d3263 68%,#2166F3);color:#fff;padding:clamp(28px,6vw,58px);border-radius:20px}
.tag{display:inline-block;background:#d9edff;color:#135b99;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:800;letter-spacing:.6px}
.hero .tag{background:rgba(255,255,255,.14);color:#cce8ff}
h1{font-size:clamp(32px,6vw,54px);line-height:1.1;letter-spacing:-1.2px;margin:18px 0}
.summary{font-size:19px;line-height:1.65;color:#e0edf8;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:12px 24px;margin-top:25px;color:#d4e8fa;font-size:14px}
.content{background:#fff;border:1px solid #e1eaf2;border-radius:18px;padding:clamp(22px,5vw,38px);margin-top:22px}
.content h2{color:var(--navy);margin:0 0 14px}.description{white-space:pre-wrap;line-height:1.8;color:#42566d}
.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:14px 22px;font-weight:750;font-size:16px;cursor:pointer}
.join-toggle{margin-top:26px}.join-form{display:none;margin-top:26px;border-top:1px solid #e1eaf2;padding-top:24px}.join-form.open{display:block}
label{display:block;font-weight:700;color:var(--navy);margin:15px 0 7px}
input,select,textarea{width:100%;border:1px solid #cbd9e5;border-radius:9px;padding:12px;font:inherit;background:#fff}
textarea{min-height:110px;resize:vertical}
.message{margin:14px 0 0;line-height:1.5}.error{color:#b42318}.success{color:#176b3a}
.empty{background:#fff;padding:28px;border-radius:16px;text-align:center;color:var(--muted)}
@media(max-width:600px){header{height:66px}main{margin:26px auto}.hero{border-radius:15px}.content{border-radius:15px}}
</style>
</head>
<body>
<header><a class="brand" href="./">♡ Одговорна Плана</a><a href="./">← Почетна</a></header>
<main>
<a class="back" href="./">← Све акције</a>
<section id="actionContent" class="empty">Учитавање акције...</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://hmfeizkmpmxcnzhwxgbn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInR5cCI6MTc5MzMyOTI3OCwiZXhwIjoyMTA4OTA1Mjc4fQ.oTZopOJEGUnxK69BOYPP11CQoGrLqUJowqpPU2uiY-4');
const root=document.getElementById('actionContent');
let currentAction=null;
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function message(text,ok){const el=document.getElementById('joinMessage');el.textContent=text;el.className='message '+(ok?'success':'error')}
async function loadAction(){
 const params=new URLSearchParams(location.search),slug=params.get('slug'),id=params.get('id');
 if(!slug&&!id){root.textContent='Акција није пронађена. Отвори је преко списка акција.';return}
 let query=db.from('actions').select('id,title,slug,summary,description,location,action_date,image_url,status').in('status',['planned','in_progress','completed']);
 query=slug?query.eq('slug',slug):query.eq('id',id);
 const {data,error}=await query.maybeSingle();
 if(error||!data){root.textContent='Ова акција тренутно није доступна.';return}
 currentAction=data;document.title=data.title+' — Одговорна Плана';
 const date=data.action_date?new Date(data.action_date+'T12:00:00').toLocaleDateString('sr-RS'):'';
 root.className='';
 root.innerHTML='<section class="hero"><span class="tag">'+(data.status==='completed'?'ЗАВРШЕНА АКЦИЈА':'ГРАЂАНСКА АКЦИЈА')+'</span><h1>'+esc(data.title)+'</h1><p class="summary">'+esc(data.summary||'')+'</p><div class="meta">'+(data.location?'<span>📍 '+esc(data.location)+'</span>':'')+(date?'<span>📅 '+esc(date)+'</span>':'')+'</div></section>'+
 '<section class="content"><h2>О акцији</h2><div class="description">'+esc(data.description||data.summary||'Више информација о овој акцији ускоро.')+'</div>'+
 (data.status==='completed'?'<p class="message">Ова акција је завршена.</p>':'<button class="btn join-toggle" id="joinToggle" type="button">Придружи се овој акцији →</button>'+
 '<form class="join-form" id="joinForm"><h2>Како желиш да се прикључиш?</h2><label for="joinType">Изабери начин прикључења</label><select id="joinType" required><option value="">Изабери начин помоћи</option><option value="Практична помоћ и волонтирање">Практична помоћ и волонтирање</option><option value="Материјал или опрема">Обезбеђивање материјала или опреме</option><option value="Стручна помоћ">Стручна помоћ и знање</option><option value="Организација и промоција">Организација и промоција</option><option value="Друго">Други начин помоћи</option></select><label for="joinName">Име и презиме</label><input id="joinName" required minlength="2" maxlength="120" placeholder="Име и презиме"><label for="joinPhone">Viber број / телефон</label><input id="joinPhone" required type="tel" maxlength="60" placeholder="Број телефона"><label for="joinNote">Додатна порука (није обавезно)</label><textarea id="joinNote" maxlength="3000" placeholder="Напиши како конкретно можеш да помогнеш..."></textarea><button class="btn" type="submit">Пошаљи пријаву</button><p id="joinMessage" class="message" role="status" aria-live="polite"></p></form>')+'</section>';
 const toggle=document.getElementById('joinToggle');
 if(toggle)toggle.addEventListener('click',()=>{document.getElementById('joinForm').classList.toggle('open');toggle.textContent=document.getElementById('joinForm').classList.contains('open')?'Затвори пријаву':'Придружи се овој акцији →';});
 const form=document.getElementById('joinForm');
 if(form)form.addEventListener('submit',submitJoin);
}
async function submitJoin(event){
 event.preventDefault();const form=event.currentTarget,btn=form.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Слање...';
 const kind=document.getElementById('joinType').value,phone=document.getElementById('joinPhone').value.trim(),note=document.getElementById('joinNote').value.trim();
 const payload={submission_type:'help',title:'Пријава за акцију: '+currentAction.title,description:(note||'Жели да се придружи акцији.')+'\nНачин прикључења: '+kind,full_name:document.getElementById('joinName').value.trim(),phone,viber_phone:phone,support_type:kind,social_links:{action_id:currentAction.id,action_slug:currentAction.slug,action_title:currentAction.title},status:'new'};
 const {error}=await db.from('civic_submissions').insert(payload);btn.disabled=false;btn.textContent='Пошаљи пријаву';
 if(error){message('Пријава није послата. Проверите интернет везу и покушајте поново.',false);return}
 form.reset();message('Пријава је успешно послата. Хвала ти! Администратор ће те контактирати.',true);
}
loadAction();
</script>
</body>
</html>
