<script>
const db=window.db,root=document.getElementById('actionDetail');
history.scrollRestoration='manual';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const param=new URLSearchParams(location.search).get('slug');
const val=(...items)=>items.find(x=>x!==null&&x!==undefined&&String(x).trim()!=='');
const mapFrame=location=>'<iframe loading="lazy" title="Мапа локације" src="https://maps.google.com/maps?q='+encodeURIComponent(location)+'&output=embed"></iframe>';
(async()=>{
 if(!param){root.innerHTML='<div class="action-empty">Није изабрана акција.</div>';return;}
 try{
  let q=db.from('actions').select('*').eq('is_published',true);
  q=param.match(/^[0-9a-f-]{36}$/i)?q.eq('id',param):q.eq('slug',param);
  const {data:a,error}=await q.maybeSingle();if(error)throw error;
  if(!a){root.innerHTML='<div class="action-empty">Акција није пронађена или није објављена.</div>';return;}
  document.title=a.title+' — Одговорна Плана';
  let approved=0;
  try{const r=await db.from('civic_submissions').select('id',{count:'exact',head:true}).eq('social_links->>kind','action').eq('social_links->>target_id',a.id).eq('status','approved');if(!r.error)approved=r.count||0;}catch(e){console.warn('Број пријављених није доступан',e);}
  const date=val(a.action_date,a.date,a.start_date);
  const place=val(a.location,a.meeting_info);
  const statusMap={planned:'ПЛАНИРАНА',in_progress:'АКТИВНА',active:'АКТИВНА',completed:'ЗАВРШЕНА'};
  const status=statusMap[a.status]||String(a.status||'ОБЈАВЉЕНА').toLocaleUpperCase('sr');
  const cover=val(a.image_url,'https://raw.githubusercontent.com/autoservisgumco-web/junacko_srce/main/Velika_Plana%2B.jpg');
  const summary=val(a.summary,a.intro,a.description,'');
  const description=val(a.description,a.intro,a.summary,'');
  const dateLabel=date?new Date(date+'T00:00:00').toLocaleDateString('sr-RS',{day:'2-digit',month:'2-digit',year:'numeric'}):'Није одређен';
  const creator=val(a.proposer_name,a.created_by_name,a.organizer_name);
  const meta='<div class="action-meta">'+(date?'<div class="action-meta-item"><span class="action-meta-icon">▣</span><div>Почетак:<strong>'+esc(dateLabel)+'</strong></div></div>':'')+(a.location?'<div class="action-meta-item"><span class="action-meta-icon">●</span><div>Локација:<strong>'+esc(a.location)+'</strong></div></div>':'')+(creator?'<div class="action-meta-item"><span class="action-meta-icon">♟</span><div>Покретач:<strong>'+esc(creator)+'</strong></div></div>':'')+'</div>';
  const overview='<section class="action-overview"><div class="action-overview-main"><span class="action-kind"><span style="color:#d71920">ϟ</span> АКЦИЈА</span><h1>'+esc(a.title)+'</h1><p class="action-summary">'+esc(summary)+'</p>'+meta+'</div>'+(approved>0?'<aside class="action-stat"><div class="action-stat-number">'+approved+'</div><div class="action-stat-label">пријављених</div></aside>':'')+'</section>';
  const panel=(id,icon,title,text)=>text?'<section class="action-panel" id="'+id+'"><h2><span>'+icon+'</span>'+title+'</h2><p class="action-description">'+esc(text)+'</p></section>':'';
  const goals=Array.isArray(a.goal_items)?a.goal_items.filter(Boolean):[];
  let html='<div class="action-cover" style="background-image:url(&quot;'+esc(cover)+'&quot;)"><span class="action-cover-status">'+esc(status)+'</span></div>'+overview;
  html+=panel('opis','●','Опис акције',description);
  if(a.reason)html+=panel('razlog','●','Зашто покрећемо акцију',a.reason);
  if(a.goal||goals.length)html+='<section class="action-panel"><h2><span>✓</span>Циљеви акције</h2>'+(a.goal?'<p class="action-description">'+esc(a.goal)+'</p>':'')+(goals.length?'<ul class="action-description">'+goals.map(x=>'<li>'+esc(typeof x==='string'?x:x.title||x.text||'')+'</li>').join('')+'</ul>':'')+'</section>';
  if(a.activities)html+=panel('plan','✓','Шта планирамо',a.activities);
  if(a.materials)html+=panel('potrebno','＋','Шта је потребно',a.materials);
  if(place)html+='<section class="action-panel"><h2><span>●</span>Место</h2><div class="action-place"><p>'+esc(place)+'</p>'+mapFrame(place)+'</div></section>';
  // Посебан јавни приказ за акције типа приступа информацијама од јавног значаја.
  if(a.action_type==='informacije_od_javnog_znacaja'){
    const {data:req,error:reqError}=await db.from('iojz_requests').select('*').eq('action_id',a.id).maybeSingle();
    if(!reqError&&req){
      const [{data:requestItems},{data:requestEvents},{data:questions,error:questionsError}]=await Promise.all([
        db.from('iojz_request_items').select('*').eq('request_id',req.id).order('item_order'),
        db.from('iojz_timeline').select('*').eq('request_id',req.id).order('event_date',{ascending:true}),
        db.from('iojz_questions').select('id,question_order,title,question_text,answer_text,analysis_text,missing_information,status').eq('request_id',req.id).order('question_order')
      ]);
      const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('sr-RS',{day:'2-digit',month:'long',year:'numeric'}):'Није евидентирано';
      const requestStatus={draft:'У припреми',sent:'Послат институцији',received:'Пријем потврђен',waiting:'Чека се одговор',extended:'Рок је продужен',answered:'Одговор је стигао',appealed:'Уложена жалба',closed:'Поступак затворен'};
      const itemStatus={pending:'Чека се',provided:'Достављено',partially_provided:'Делимично достављено',refused:'Одбијено',not_available:'Информација не постоји'};
      const questionStatus={unanswered:'Без одговора',partially_answered:'Делимично одговорено',answered:'Одговорено',not_provided:'Није достављен документ',verification_needed:'Потребна провера'};
      const statusClass=s=>s==='answered'?'is-done':s==='verification_needed'?'is-review':s==='unanswered'?'is-waiting':'is-partial';
      const questionParam=new URLSearchParams(location.search).get('pitanje');
      const activeQuestion=questionsError?null:(questions||[]).find(q=>String(q.question_order)===questionParam||q.id===questionParam);
      const facts='<div class="iojz-facts"><div><small>Институција</small><strong>'+esc(req.institution_name)+'</strong></div><div><small>Датум слања</small><strong>'+fmt(req.sent_at)+'</strong></div><div><small>Одговор</small><strong>'+fmt(req.response_date)+'</strong></div></div>';
      const list=(questions||[]).map(q=>'<a class="iojz-question-link" href="akcija.html?slug='+encodeURIComponent(a.slug||a.id)+'&pitanje='+encodeURIComponent(q.question_order)+'"><span class="iojz-q-number">'+String(q.question_order).padStart(2,'0')+'</span><span class="iojz-q-copy"><strong>'+esc(q.title)+'</strong><small>'+esc(questionStatus[q.status]||'Статус није унет')+'</small></span><span class="iojz-q-arrow">›</span></a>').join('');
      const detail=activeQuestion?'<div class="iojz-question-screen"><a class="iojz-back" href="akcija.html?slug='+encodeURIComponent(a.slug||a.id)+'">← Назад на сва питања</a><div class="iojz-question-title"><span class="iojz-kicker">ПИТАЊЕ '+activeQuestion.question_order+' ОД '+(questions||[]).length+'</span><h3>'+esc(activeQuestion.title)+'</h3><span class="iojz-status '+statusClass(activeQuestion.status)+'">'+esc(questionStatus[activeQuestion.status]||'Статус није унет')+'</span></div><section class="iojz-answer-block"><h4>Оригинални текст питања</h4><div class="iojz-original-text">'+esc(activeQuestion.question_text)+'</div></section><section class="iojz-answer-block"><h4>Одговор институције</h4><div class="iojz-prose">'+(activeQuestion.answer_text?esc(activeQuestion.answer_text):'Одговор још није евидентиран.')+'</div></section><section class="iojz-answer-block"><h4>Анализа одговора</h4><div class="iojz-prose">'+(activeQuestion.analysis_text?esc(activeQuestion.analysis_text):'Анализа још није унета.')+'</div></section>'+(activeQuestion.missing_information?'<section class="iojz-answer-block"><h4>Шта недостаје?</h4><div class="iojz-prose">'+esc(activeQuestion.missing_information)+'</div></section>':'')+'<nav class="iojz-question-pager">'+(activeQuestion.question_order>1?'<a href="akcija.html?slug='+encodeURIComponent(a.slug||a.id)+'&pitanje='+(activeQuestion.question_order-1)+'">← Претходно питање</a>':'<span></span>')+(activeQuestion.question_order<(questions||[]).length?'<a href="akcija.html?slug='+encodeURIComponent(a.slug||a.id)+'&pitanje='+(activeQuestion.question_order+1)+'">Следеће питање →</a>':'<span></span>')+'</nav></div>':'<div class="iojz-question-list"><p class="iojz-list-lead">Захтев је поднет '+fmt(req.sent_at)+'. Изабери питање да погледаш оригинални текст, одговор институције и анализу. Сваки приказ се отвара засебно.</p>'+(questionsError?'<p class="iojz-error">Питања тренутно нису доступна.</p>':(questions||[]).length?list:'<p>Питања још нису унета.</p>')+'</div>';
      const requestedItems=(requestItems||[]).map(it=>'<li class="iojz-item"><span class="iojz-item-number">'+it.item_order+'</span><div><p>'+esc(it.requested_information)+'</p><small>'+esc(itemStatus[it.response_status]||'Чека се одговор')+'</small></div></li>').join('');
      const events=(requestEvents||[]).map(ev=>'<div class="iojz-event"><time>'+fmt(ev.event_date)+'</time><strong>'+esc(ev.title)+'</strong><p>'+esc(ev.description||'')+'</p></div>').join('');
      const requestPanel='<section class="action-panel iojz-public"><div class="iojz-head"><div><span class="iojz-kicker">ПОСТУПАК ПРИСТУПА ИНФОРМАЦИЈАМА</span><h2>Захтев за информације од јавног значаја</h2></div><span class="iojz-status">'+esc(requestStatus[req.status]||req.status)+'</span></div><p class="iojz-subject">'+esc(req.subject||a.title)+'</p>'+facts+detail+'<details class="iojz-details"><summary>Подаци о захтеву и хронологија</summary><p class="iojz-list-lead">Референца: '+esc(req.reference_number||'Није евидентирана')+'</p><ol class="iojz-items">'+requestedItems+'</ol><div class="iojz-timeline">'+(events||'<p>Нема забележених догађаја.</p>')+'</div></details></section>';
      if(activeQuestion){
        let documentHtml='';
        const {data:dbDocs,error:docsError}=await db.from('iojz_documents')
          .select('title,file_name,file_url,document_date')
          .eq('request_id',req.id)
          .eq('is_public',true)
          .order('document_date',{ascending:true});
        if(docsError) console.warn('Документација није доступна',docsError);
        const docs=(dbDocs||[]).map(doc=>({
          label:doc.title||doc.file_name||'Службени документ',
          name:doc.file_name||'Документ.pdf',
          description:doc.document_date?'Датум документа: '+fmt(doc.document_date):'Званични документ уз захтев',
          url:doc.file_url||null
        }));
        if(docs.length){
          documentHtml='<section class="iojz-documents"><div class="iojz-documents-heading"><span class="iojz-kicker">ЗВАНИЧНА ДОКУМЕНТА</span><h2>Документација и PDF одговори</h2><p>Оригинални документи повезани са овим захтевом.</p></div><div class="iojz-document-list">'+docs.map(doc=>'<article class="iojz-document-card"><span class="iojz-pdf-icon">PDF</span><div class="iojz-document-copy"><strong>'+esc(doc.label)+'</strong><small>'+esc(doc.description)+'</small></div>'+(doc.url?'<div class="iojz-document-actions"><a href="'+esc(doc.url)+'" target="_blank" rel="noopener">Отвори документ</a></div>':'<p class="iojz-document-error">Линк документа није доступан.</p>')+'</article>').join('')+'</div></section>';
        }
        html='<div class="iojz-page iojz-single-question"><section class="site-shared-hero hero-full iojz-question-hero"><div class="hero-inner"><div class="hero-copy"><p class="eyebrow">ОДГОВОРНА ПЛАНА · ИНФОРМАЦИЈЕ ОД ЈАВНОГ ЗНАЧАЈА</p><h1>Питање '+String(activeQuestion.question_order).padStart(2,'0')+'</h1><p class="lead">'+esc(activeQuestion.title)+'</p><div class="iojz-answer-status '+statusClass(activeQuestion.status)+'"><span>СТАТУС ОДГОВОРА</span><strong>'+esc(questionStatus[activeQuestion.status]||'Статус није унет')+'</strong></div><div class="hero-buttons"><a class="iojz-hero-back" href="akcija.html?slug='+encodeURIComponent(a.slug||a.id)+'">← Сва питања</a></div></div></div></section><section class="iojz-question-screen"><section class="iojz-answer-block"><h2>Оригинални текст питања</h2><div class="iojz-original-text">'+esc(activeQuestion.question_text)+'</div></section><section class="iojz-answer-block"><h2>Одговор институције</h2><div class="iojz-prose">'+(activeQuestion.answer_text?esc(activeQuestion.answer_text):'Одговор још није евидентиран.')+'</div></section>'+documentHtml+'</section></div>';
      }else{
        html='<div class="iojz-page"><a class="iojz-return" href="/akcije.html">← Све акције</a><header class="iojz-page-hero"><span class="iojz-kicker">ОДГОВОРНА ПЛАНА · ЈАВНОСТ И ОДГОВОРНОСТ</span><span class="iojz-page-type">ИНФОРМАЦИЈЕ ОД ЈАВНОГ ЗНАЧАЈА</span><h1>'+esc(a.title)+'</h1><p>Пратимо шта је затражено, шта је институција доставила и шта још треба разјаснити.</p><div class="iojz-page-meta"><span>Институција: <strong>'+esc(req.institution_name||'Није наведена')+'</strong></span><span>Датум захтева: <strong>'+fmt(req.sent_at)+'</strong></span><span>Одговор: <strong>'+fmt(req.response_date)+'</strong></span></div></header>'+requestPanel+'</div>';
      }
    } else {
      html='<div class="iojz-page"><a class="iojz-return" href="/akcije.html">← Све акције</a><section class="action-panel iojz-public"><h2>Подаци о захтеву нису доступни</h2><p>Тренутно није могуће учитати евиденцију захтева. Покушај поново касније.</p></section></div>';
    }
  }
  if(a.action_type!=='informacije_od_javnog_znacaja') html+='<section class="action-callout"><span class="action-heart">♥</span><div><h2>Укључи се!</h2><p>Заједно можемо више. Пријави се, подржи акцију и помози да наша заједница буде боље место за све.</p></div><button type="button" class="action-red" id="joinThisAction">♟ &nbsp;Пријави се</button></section>';
  if(a.action_type!=='informacije_od_javnog_znacaja') html+='<section class="action-banner"><h2>Имаш проблем који не треба да остане само прича?</h2><p>Покрени акцију и заједно тражимо решење.</p><a class="action-red" href="/predlog-akcije.html">ϟ &nbsp;Покрени акцију</a></section>';
  root.className='';root.innerHTML=html;
  if(new URLSearchParams(location.search).has('pitanje')) window.scrollTo(0,0);
  root.querySelector('#joinThisAction')?.addEventListener('click',()=>window.OPProposalModal?.openParticipation(a));
 }catch(e){console.error(e);root.innerHTML='<div class="action-empty">Детаљи акције тренутно нису доступни.</div>';}
})();
</script>
<script src="/bottom-nav.js"></script>
<script src="/shared-proposal-modal.js"></script>
</body></html>
